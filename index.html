function playSfx(type){
    try{
        if(!audioCtx){
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        }
        if(audioCtx.state==="suspended")audioCtx.resume();
        const now=audioCtx.currentTime;
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const volMap={
            shoot:.3, shotgun:.5, jackhammer:.7, rail:.5,
            coin:.2, parry:.8, explosion:.8, groan:.25
        };
        
        const freqMap={
            shoot:[600,40,.1],
            shotgun:[150,20,.25],
            jackhammer:[80,10,.35],
            rail:[1200,80,.4],
            coin:[1800,2400,.15],
            parry:[800,1800,.2],
            explosion:[100,10,.6],
            groan:[90,50,.3]
        };
        
        if(freqMap[type]){
            const [startFreq,endFreq,duration]=freqMap[type];
            osc.type=type==='coin'?'sine':type==='parry'?'triangle':'sawtooth';
            osc.frequency.setValueAtTime(startFreq,now);
            osc.frequency.exponentialRampToValueAtTime(endFreq,now+duration);
            gain.gain.setValueAtTime(volMap[type]||.3,now);
            gain.gain.linearRampToValueAtTime(.01,now+duration);
            osc.start(now);
            osc.stop(now+duration+.1);
        }
    }catch(e){}
}

// ============================================================

function makeTexture(w,h,drawFn){
    const cnv=document.createElement("canvas");
    cnv.width=w; cnv.height=h;
    const ctx=cnv.getContext("2d");
    drawFn(ctx,w,h);
    const tex=new THREE.CanvasTexture(cnv);
    tex.needsUpdate=true;
    return tex;
}

function makeSkinTexture(baseColor,blotchColor){
    return makeTexture(128,128,(ctx,w,h)=>{
        ctx.fillStyle=baseColor;
        ctx.fillRect(0,0,w,h);
        for(let i=0;i<45;i++){
            ctx.globalAlpha=.12+Math.random()*.28;
            ctx.fillStyle=blotchColor;
            const x=Math.random()*w,y=Math.random()*h,r=2+Math.random()*9;
            ctx.beginPath();
            ctx.arc(x,y,r,0,Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha=1;
        ctx.strokeStyle="rgba(20,10,10,.35)";
        ctx.lineWidth=1;
        for(let i=0;i<18;i++){
            let x=Math.random()*w,y=Math.random()*h;
            ctx.beginPath();
            ctx.moveTo(x,y);
            for(let j=0;j<4;j++){
                x+=(Math.random()-.5)*22;
                y+=(Math.random()-.5)*22;
                ctx.lineTo(x,y);
            }
            ctx.stroke();
        }
    });
}

function makeFaceTexture(baseColor){
    return makeTexture(128,128,(ctx,w,h)=>{
        ctx.fillStyle=baseColor;
        ctx.fillRect(0,0,w,h);
        for(let i=0;i<20;i++){
            ctx.globalAlpha=.1+Math.random()*.2;
            ctx.fillStyle="#1a1512";
            ctx.beginPath();
            ctx.arc(Math.random()*w,Math.random()*h,2+Math.random()*5,0,Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha=1;
        ctx.fillStyle="rgba(8,8,8,.9)";
        ctx.beginPath();
        ctx.ellipse(w*.32,h*.4,11,8,0,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w*.68,h*.4,11,8,0,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="#c9d97a";
        ctx.beginPath();
        ctx.arc(w*.32,h*.4,2.6,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w*.68,h*.4,2.6,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="rgba(10,6,6,.6)";
        ctx.beginPath();
        ctx.ellipse(w*.5,h*.54,5,7,0,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="rgba(12,4,4,.92)";
        ctx.beginPath();
        ctx.ellipse(w*.5,h*.7,18,10,0,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="#d8d3c4";
        for(let i=0;i<6;i++){
            ctx.fillRect(w*.5-17+i*6,h*.64,4,7);
        }
    });
}

function makeBuildingTexture(baseColor){
    return makeTexture(256,256,(ctx,w,h)=>{
        ctx.fillStyle=baseColor;
        ctx.fillRect(0,0,w,h);
        for(let i=0;i<22;i++){
            ctx.strokeStyle="rgba(0,0,0,"+(0.05+Math.random()*.15)+")";
            ctx.lineWidth=2+Math.random()*6;
            const x=Math.random()*w;
            ctx.beginPath();
            ctx.moveTo(x,0);
            ctx.lineTo(x+(Math.random()-.5)*14,h);
            ctx.stroke();
        }
        const cols=6,rows=9;
        for(let r=0;r<rows;r++){
            for(let c=0;c<cols;c++){
                const wx=c*(w/cols)+6;
                const wy=r*(h/rows)+6;
                const ww=w/cols-12;
                const wh=h/rows-12;
                const broken=Math.random()<.4;
                const lit=!broken&&Math.random()<.12;
                ctx.fillStyle=broken?"rgba(4,4,4,.9)":(lit?"rgba(190,160,80,.55)":"rgba(8,12,12,.85)");
                ctx.fillRect(wx,wy,ww,wh);
            }
        }
    });
}

function makeAsphaltTexture(){
    return makeTexture(256,256,(ctx,w,h)=>{
        ctx.fillStyle="#141210";
        ctx.fillRect(0,0,w,h);
        for(let i=0;i<400;i++){
            ctx.fillStyle="rgba(255,255,255,"+(Math.random()*.035)+")";
            ctx.fillRect(Math.random()*w,Math.random()*h,1,1);
        }
        ctx.strokeStyle="rgba(0,0,0,.5)";
        ctx.lineWidth=1;
        for(let i=0;i<28;i++){
            let x=Math.random()*w,y=Math.random()*h;
            ctx.beginPath();
            ctx.moveTo(x,y);
            for(let j=0;j<6;j++){
                x+=(Math.random()-.5)*32;
                y+=(Math.random()-.5)*32;
                ctx.lineTo(x,y);
            }
            ctx.stroke();
        }
    });
}

// ============================================================
// VIEWPORT
// ============================================================

function getViewportRect(){
    if(window.visualViewport){
        return{w:window.visualViewport.width,h:window.visualViewport.height,
               left:window.visualViewport.offsetLeft,top:window.visualViewport.offsetTop};
    }
    return{w:window.innerWidth,h:window.innerHeight,left:0,top:0};
}

function syncViewport(){
    const rect=getViewportRect();
    const container=document.getElementById("game-container");
    const hud=document.getElementById("hud");
    const flash=document.getElementById("flash-screen");
    [container,hud,flash].forEach(el=>{
        if(!el)return;
        el.style.width=rect.w+"px";
        el.style.height=rect.h+"px";
        el.style.left=rect.left+"px";
        el.style.top=rect.top+"px";
    });
    if(camera&&renderer&&rect.w>0&&rect.h>0){
        camera.aspect=rect.w/rect.h;
        camera.updateProjectionMatrix();
        renderer.setSize(rect.w,rect.h);
    }
}

function initEngine(){
    const container=document.getElementById("game-container");
    container.innerHTML="";
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0906);
    scene.fog=new THREE.FogExp2(0x0a0906,.02);
    
    const ambient=new THREE.AmbientLight(0x3a3a30,.55);
    scene.add(ambient);
    const hemi=new THREE.HemisphereLight(0x4a5a4a,0x0a0906,.45);
    scene.add(hemi);
    const moon=new THREE.DirectionalLight(0x8a9aa0,.65);
    moon.position.set(-30,60,-20);
    scene.add(moon);
    
    playerLight=new THREE.PointLight(0xffe0b0,1.1,26,2);
    scene.add(playerLight);
    
    const rect=getViewportRect();
    camera=new THREE.PerspectiveCamera(75,rect.w/rect.h,.1,500);
    renderer=new THREE.WebGLRenderer({antialias:false,precision:"mediump"});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(rect.w,rect.h);
    container.appendChild(renderer.domElement);
    
    player.pos.set(0,2,0);
    camera.position.copy(player.pos);
    
    buildDeadCity();
    setupEvents();
    spawnWave();
    syncViewport();
    
    window.addEventListener("resize",syncViewport);
    window.addEventListener("orientationchange",()=>setTimeout(syncViewport,250));
    if(window.visualViewport){
        window.visualViewport.addEventListener("resize",syncViewport);
        window.visualViewport.addEventListener("scroll",syncViewport);
    }
    setTimeout(syncViewport,300);
    setTimeout(syncViewport,900);
}

// ============================================================
// ГОРОД

function buildDeadCity(){
    cityColliders=[];
    const asphaltTex=makeAsphaltTexture();
    asphaltTex.wrapS=THREE.RepeatWrapping;
    asphaltTex.wrapT=THREE.RepeatWrapping;
    asphaltTex.repeat.set(24,24);
    
    const road=new THREE.Mesh(
        new THREE.PlaneGeometry(160,160),
        new THREE.MeshStandardMaterial({map:asphaltTex,roughness:1})
    );
    road.rotation.x=-Math.PI/2;
    scene.add(road);
    groundMesh=road;
    cityColliders.push(road);
    
    const buildingColors=["#6b6255","#5a4a3a","#4a5248","#3f3f3d"];
    for(let i=0;i<24;i++){
        const angle=i/24*Math.PI*2;
        const dist=38+Math.random()*25;
        const x=Math.cos(angle)*dist;
        const z=Math.sin(angle)*dist;
        const width=8+Math.random()*8;
        const height=20+Math.random()*38;
        const depth=8+Math.random()*8;
        const color=buildingColors[i%buildingColors.length];
        const group=new THREE.Group();
        const tex=makeBuildingTexture(color);
        const body=new THREE.Mesh(
            new THREE.BoxGeometry(width,height,depth),
            new THREE.MeshStandardMaterial({map:tex,roughness:.95})
        );
        body.position.y=height/2;
        group.add(body);
        const edges=new THREE.LineSegments(
            new THREE.EdgesGeometry(body.geometry),
            new THREE.LineBasicMaterial({color:0x2a2018,transparent:true,opacity:.6})
        );
        edges.position.copy(body.position);
        group.add(edges);
        group.rotation.y=(Math.random()-.5)*.4;
        group.rotation.z=(Math.random()-.5)*.06;
        group.position.set(x,0,z);
        scene.add(group);
        cityColliders.push(body);
    }
    
    const rubbleTex=makeBuildingTexture("#3a352a");
    for(let i=0;i<40;i++){
        const size=.4+Math.random()*1.4;
        const rubble=new THREE.Mesh(
            new THREE.BoxGeometry(size,size*.6,size),
            new THREE.MeshStandardMaterial({map:rubbleTex,roughness:1})
        );
        const angle=Math.random()*Math.PI*2;
        const dist=Math.random()*55;
        rubble.position.set(Math.cos(angle)*dist,size*.3,Math.sin(angle)*dist);
        rubble.rotation.y=Math.random()*Math.PI;
        scene.add(rubble);
    }
}

function buildZombieMesh(type){
    const group=new THREE.Group();
    let skinBase,skinBlotch,clothColor,faceColor,scale,hunch;
    
    const configs={
        brute:{skin:"#5c4a3a",blotch:"#2e2019",cloth:"#332e29",face:"#6b5548",scale:1.35,hunch:.08},
        spitter:{skin:"#7a9a3a",blotch:"#3f4d18",cloth:"#4d5a24",face:"#8ab04a",scale:1,hunch:.15},
        bloater:{skin:"#725b43",blotch:"#38271b",cloth:"#42342a",face:"#876b50",scale:1.25,hunch:.18},
        shield:{skin:"#596451",blotch:"#283025",cloth:"#33362e",face:"#6c785e",scale:1.15,hunch:.08},
        rocketeer:{skin:"#6b7a5a",blotch:"#333d28",cloth:"#453c33",face:"#7a8a6a",scale:1.1,hunch:.15},
        zombie:{skin:"#6b7a5a",blotch:"#333d28",cloth:"#453c33",face:"#7a8a6a",scale:.9,hunch:.3}
    };
    
    const cfg=configs[type]||configs.zombie;
    skinBase=cfg.skin; skinBlotch=cfg.blotch; clothColor=cfg.cloth; 
    faceColor=cfg.face; scale=cfg.scale; hunch=cfg.hunch;
    
    const skinTex=makeSkinTexture(skinBase,skinBlotch);
    const faceTex=makeFaceTexture(faceColor);
    const clothTex=makeSkinTexture(clothColor,skinBlotch);
    
    const skinMat=new THREE.MeshStandardMaterial({map:skinTex,roughness:.95});
    const clothMat=new THREE.MeshStandardMaterial({map:clothTex,roughness:.95});
    const faceMat=new THREE.MeshStandardMaterial({map:faceTex,roughness:.9});
    
    const torsoMats=[skinMat,skinMat,clothMat,skinMat,clothMat,clothMat];
    const torso=new THREE.Mesh(
        new THREE.BoxGeometry(1.05*scale,1.7*scale,.65*scale),
        torsoMats
    );
    torso.position.y=1.55*scale;
    torso.rotation.x=hunch;
    torso.name="torso";
    group.add(torso);
    
    const headMats=[skinMat,skinMat,skinMat,skinMat,faceMat,faceMat];
    const head=new THREE.Mesh(
        new THREE.BoxGeometry(.5*scale,.56*scale,.5*scale),
        headMats
    );
    head.position.set(0,2.7*scale,.15*scale*hunch*3);
    head.name="head";
    group.add(head);
    
    const armGeo=new THREE.CylinderGeometry(.12*scale,.15*scale,1.25*scale,6);
    const armL=new THREE.Mesh(armGeo,skinMat);
    armL.position.set(-.7*scale,1.7*scale,0);
    armL.rotation.z=.35;
    armL.name="armL";
    group.add(armL);
    
    const armR=new THREE.Mesh(armGeo,skinMat);
    armR.position.set(.7*scale,1.7*scale,0);
    armR.rotation.z=-.35;
    armR.name="armR";
    group.add(armR);
    
    const legGeo=new THREE.CylinderGeometry(.16*scale,.19*scale,1.5*scale,6);
    const legL=new THREE.Mesh(legGeo,clothMat);
    legL.position.set(-.28*scale,.75*scale,0);
    legL.name="legL";
    group.add(legL);
    
    const legR=new THREE.Mesh(legGeo,clothMat);
    legR.position.set(.28*scale,.75*scale,0);
    legR.name="legR";
    group.add(legR);
    
    // Щит для щитовика
    if(type==="shield"){
        const shield=new THREE.Mesh(
            new THREE.BoxGeometry(1.8,2.4,.22),
            new THREE.MeshStandardMaterial({color:0x41443d,metalness:.7,roughness:.55})
        );
        shield.position.set(0,1.55,-.65);
        shield.name="shield";
        group.add(shield);
        const rim=new THREE.LineSegments(
            new THREE.EdgesGeometry(shield.geometry),
            new THREE.LineBasicMaterial({color:0xc9a227})
        );
        rim.position.copy(shield.position);
        group.add(rim);
    }
    
    // Ракетница для ракетчика
    if(type==="rocketeer"){
        const launcher=new THREE.Mesh(
            new THREE.CylinderGeometry(.22,.28,1.5,8),
            new THREE.MeshStandardMaterial({color:0x44433a,metalness:.7})
        );
        launcher.rotation.z=Math.PI/2;
        launcher.position.set(.75,1.9,-.2);
        launcher.name="launcher";
        group.add(launcher);
    }
    
    // Анимируемые части
    group.userData.animParts={
        torso:torso,
        head:head,
        armL:armL,
        armR:armR,
        legL:legL,
        legR:legR
    };
    group.userData.animState={
        type:"idle",
        time:0,
        attackTime:0,
        hitTime:0,
        staggerTime:0,
        deathTime:0,
        isDead:false
    };
    
    return group;
}

function createTurretMesh(){
    const group=new THREE.Group();
    
    // Тело
    const body=new THREE.Mesh(
        new THREE.BoxGeometry(1.2,1.4,1.0),
        new THREE.MeshStandardMaterial({color:0x4b4941,metalness:.75})
    );
    body.position.y=1.0;
    body.name="body";
    group.add(body);
    
    // Голова-винтовка
    const barrelGroup=new THREE.Group();
    barrelGroup.position.set(0,1.4,.3);
    barrelGroup.name="barrelGroup";
    
    const barrel=new THREE.Mesh(
        new THREE.CylinderGeometry(.08,.12,1.6,8),
        new THREE.MeshStandardMaterial({color:0x252622,metalness:1})
    );
    barrel.rotation.x=Math.PI/2;
    barrel.position.z=-.8;
    barrel.name="barrel";
    barrelGroup.add(barrel);
    
    const scope=new THREE.Mesh(
        new THREE.BoxGeometry(.3,.2,.4),
        new THREE.MeshStandardMaterial({color:0x33332e,metalness:.8})
    );
    scope.position.set(0,.2,-.4);
    barrelGroup.add(scope);
    
    group.add(barrelGroup);
    
    // Ноги
    const legGeo=new THREE.CylinderGeometry(.12,.15,.8,6);
    const legMat=new THREE.MeshStandardMaterial({color:0x3a3833,metalness:.7});
    
    for(let i=0;i<3;i++){
        const angle=(i/3)*Math.PI*2;
        const leg=new THREE.Mesh(legGeo,legMat);
        leg.position.set(Math.cos(angle)*.5,.4,Math.sin(angle)*.5);
        leg.name="leg"+i;
        group.add(leg);
        
        // Сустав
        const joint=new THREE.Mesh(
            new THREE.SphereGeometry(.1,6,6),
            new THREE.MeshStandardMaterial({color:0x55554a,metalness:.8})
        );
        joint.position.set(Math.cos(angle)*.5,.8,Math.sin(angle)*.5);
        joint.name="joint"+i;
        group.add(joint);
    }
    
    group.userData.barrelGroup=barrelGroup;
    group.userData.animState={
        type:"idle",
        time:0,
        attackTime:0,
        hitTime:0,
        staggerTime:0,
        deathTime:0,
        isDead:false
    };
    
    return group;
}

class Enemy{
    constructor(type,pos){
        this.type=type;
        this.dead=false;
        this.attackTimer=0;
        this.specialTimer=0;
        this.core=null;
        this.hitReactTimer=0;
        this.staggerTimer=0;
        this.animTime=0;
        
        const stats={
            brute:{hp:250,speed:4},
            spitter:{hp:80,speed:5.5},
            shield:{hp:180,speed:5},
            bloater:{hp:100,speed:2.7},
            rocketeer:{hp:120,speed:3.8},
            drone:{hp:90,speed:7},
            turret:{hp:160,speed:0},
            swarm:{hp:22,speed:12},
            carrier:{hp:140,speed:4},
            zombie:{hp:45,speed:10}
        };
        
        const s=stats[type]||stats.zombie;
        this.hp=s.hp;
        this.maxHp=s.hp;
        this.speed=s.speed;
        
        // Создание меша
        if(type==="turret"){
            this.mesh=createTurretMesh();
            this.mesh.position.copy(pos);
            this.mesh.position.y=0;
        }else if(type==="drone"){
            this.mesh=createDroneMesh();
            this.mesh.position.copy(pos);
            this.mesh.position.y=7+Math.random()*3;
        }else if(type==="swarm"){
            this.mesh=createSwarmMesh();
            this.mesh.position.copy(pos);
            this.mesh.position.y=.7;
        }else if(type==="carrier"){
            this.mesh=createCarrierMesh();
            this.mesh.position.copy(pos);
            this.core=this.mesh.getObjectByName("enemyCore");
        }else{
            this.mesh=buildZombieMesh(type);
            this.mesh.position.copy(pos);
        }
        
        scene.add(this.mesh);
        
        // Анимационные состояния
        this.animState=this.mesh.userData.animState||{
            type:"idle",
            time:0,
            attackTime:0,
            hitTime:0,
            staggerTime:0,
            deathTime:0,
            isDead:false
        };
        
        // Для турели
        if(type==="turret"){
            this.barrelGroup=this.mesh.userData.barrelGroup;
        }
    }
    
    takeDamage(dmg,source="normal",hitPoint=null){
        if(this.dead)return;
        
        // Щитовик: фронтальный hitscan блокируется
        if(this.type==="shield"&&source!=="jackhammer"){
            const toPlayer=new THREE.Vector3().subVectors(player.pos,this.mesh.position).normalize();
            const forward=new THREE.Vector3(0,0,1).applyQuaternion(this.mesh.quaternion);
            const facing=forward.dot(toPlayer);
            if(facing>0){
                playSfx("parry");
                addStyle(80,"SHIELD RICOCHET");
                if(hitPoint){
                    createTracer(hitPoint,hitPoint.clone().add(
                        new THREE.Vector3((Math.random()-.5)*4,Math.random()*2,4)
                    ),0xc9a227,.2);
                }
                return;
            }
        }
        
        // Ядро-носитель
        if(this.type==="carrier"&&source==="core"){
            this.hp-=dmg;
        }else{
            this.hp-=dmg;
        }
        
        // Hit reaction
        this.hitReactTimer=.3;
        this.animState.hitTime=.3;
        this.animState.type="hit";
        
        // Hit-stop
        if(source==="jackhammer"||source==="core"){
            triggerHitStop(.2);
        }else if(source==="parry"){
            triggerHitStop(.15);
        }else if(source==="rail"){
            triggerHitStop(.1);
        }
        
        createParticles(hitPoint||this.mesh.position,0x8b3a2f,6);
        
        if(this.hp<=0){
            this.die();
        }
    }
    
    die(){
        if(this.dead)return;
        this.dead=true;
        this.animState.isDead=true;
        this.animState.type="death";
        this.animState.deathTime=0;
        
        // Смертник взрывается
        if(this.type==="bloater"){
            playSfx("explosion");
            addStyle(250,"BLOATER BURST");
            const pos=this.mesh.position.clone();
            createExplosion(pos,7,0x8b3a2f);
            enemies.slice().forEach(e=>{
                if(e!==this&&!e.dead&&e.mesh.position.distanceTo(pos)<7){
                    e.takeDamage(140,"explosion");
                }
            });
        }else{
            addStyle(this.type==="swarm"?40:120,this.type.toUpperCase()+" KILL");
            createExplosion(this.mesh.position,2.5,0x8b3a2f);
        }
        
        setTimeout(()=>{
            scene.remove(this.mesh);
        },500);
        
        enemiesKilledThisWave++;
        enemies=enemies.filter(e=>e!==this);
    }
    
    update(dt){
        if(this.dead){
            if(this.animState.deathTime<1){
                this.animState.deathTime+=dt;
                this.updateAnimation(dt);
            }
            return;
        }
        
        // Hit react
        if(this.hitReactTimer>0){
            this.hitReactTimer-=dt;
            if(this.hitReactTimer<=0){
                this.animState.type="idle";
            }
        }
        
        const dir=new THREE.Vector3().subVectors(player.pos,this.mesh.position);
        dir.y=0;
        const dist=dir.length();
        if(dist>0.0001)dir.normalize();
        
        // Обновление анимации
        this.animState.time+=dt;
        this.updateAnimation(dt);
        
        // Обычные зомби
        if(["zombie","brute","bloater","swarm"].includes(this.type)){
            if(dist>1.8 && this.type!=="bloater"){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            
            if(this.type==="zombie"&&dist<2.2){
                this.attackTimer+=dt;
                if(this.attackTimer>.8){
                    this.attackTimer=0;
                    damagePlayer(15);
                    this.animState.type="attack";
                    this.animState.attackTime=0;
                }
            }
            if(this.type==="brute"&&dist<3.2){
                this.attackTimer+=dt;
                if(this.attackTimer>1.2){
                    this.attackTimer=0;
                    damagePlayer(30);
                    this.animState.type="attack";
                    this.animState.attackTime=0;
                }
            }
            if(this.type==="bloater"&&dist<2){
                this.die();
            }
        }
        
        // Спиттер
        else if(this.type==="spitter"){
            if(dist>12){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            if(dist<28){
                this.attackTimer+=dt;
                if(this.attackTimer>2.2){
                    this.attackTimer=0;
                    spawnSpit(this.mesh.position.clone().add(new THREE.Vector3(0,2.5,0)),dir);
                    this.animState.type="attack";
                    this.animState.attackTime=0;
                }
            }
        }
        
        // Щитовик
        else if(this.type==="shield"){
            if(dist>3){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            if(dist<2.6){
                this.attackTimer+=dt;
                if(this.attackTimer>1){
                    this.attackTimer=0;
                    damagePlayer(22);
                    this.animState.type="attack";
                    this.animState.attackTime=0;
                }
            }
        }
        
        // Ракетчик
        else if(this.type==="rocketeer"){
            if(dist>15){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            if(dist<40){
                this.attackTimer+=dt;
                if(this.attackTimer>2.5){
                    this.attackTimer=0;
                    spawnEnemyRocket(this.mesh.position.clone().add(new THREE.Vector3(0,1.8,0)),dir);
                    this.animState.type="attack";
                    this.animState.attackTime=0;
                }
            }
        }
        
        // Дрон
        else if(this.type==="drone"){
            const targetY=player.pos.y+2;
            this.mesh.position.y+=(targetY-this.mesh.position.y)*dt*1.5;
            if(dist>10){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            this.attackTimer+=dt;
            if(dist<35&&this.attackTimer>2){
                this.attackTimer=0;
                spawnSpit(this.mesh.position.clone(),new THREE.Vector3().subVectors(player.pos,this.mesh.position).normalize());
                this.animState.type="attack";
                this.animState.attackTime=0;
            }
        }
        
        // Турель на ногах
        else if(this.type==="turret"){
            // Поворот к игроку
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            // Поворот ствола
            if(this.barrelGroup){
                const aimDir=new THREE.Vector3().subVectors(player.pos,this.barrelGroup.getWorldPosition(new THREE.Vector3())).normalize();
                const quat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),aimDir);
                this.barrelGroup.quaternion.slerp(quat,dt*8);
            }
            
            // Ходьба (медленная)
            if(dist>15){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            
            // Стрельба
            this.attackTimer+=dt;
            if(dist<65&&this.attackTimer>2.5){
                this.attackTimer=0;
                spawnTurretShot(this.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)));
                this.animState.type="attack";
                this.animState.attackTime=0;
                // Визуальный эффект выстрела
                flashScreen(0x4a6b6b);
            }
        }
        
        // Носитель ядра
        else if(this.type==="carrier"){
            if(dist>8){
                this.mesh.position.addScaledVector(dir,this.speed*dt);
                this.animState.type="walk";
            }else{
                this.animState.type="idle";
            }
            this.mesh.lookAt(player.pos.x,this.mesh.position.y,player.pos.z);
            this.specialTimer+=dt;
            if(dist<30&&this.specialTimer>3){
                this.specialTimer=0;
                spawnCarrierPulse(this.mesh.position.clone());
                this.animState.type="attack";
                this.animState.attackTime=0;
            }
        }
    }
    
    updateAnimation(dt){
        const state=this.animState;
        const parts=this.mesh.userData.animParts;
        if(!parts)return;
        
        const {torso,head,armL,armR,legL,legR}=parts;
        const time=state.time;
        
        if(state.isDead){
            // Анимация смерти
            const deathProgress=Math.min(state.deathTime/.5,1);
            if(torso)torso.rotation.x=0.3*deathProgress;
            if(head)head.rotation.x=0.5*deathProgress;
            if(armL)armL.rotation.x=-1.5*deathProgress;
            if(armR)armR.rotation.x=1.5*deathProgress;
            if(legL)legL.rotation.x=0.5*deathProgress;
            if(legR)legR.rotation.x=-0.5*deathProgress;
            if(torso)torso.position.y=1.55 - 0.3*deathProgress;
            return;
        }
        
        switch(state.type){
            case"walk":
                // Ходьба
                const walkSpeed=this.type==="turret"?2:8;
                const walkCycle=Math.sin(time*walkSpeed);
                if(legL)legL.rotation.x=walkCycle*0.5;
                if(legR)legR.rotation.x=-walkCycle*0.5;
                if(armL)armL.rotation.x=-walkCycle*0.3;
                if(armR)armR.rotation.x=walkCycle*0.3;
                if(torso)torso.position.y=1.55 + Math.abs(walkCycle)*0.05;
                if(head)head.position.y=2.7*1.1 + Math.abs(walkCycle)*0.02;
                break;
                
            case"attack":
                // Атака
                state.attackTime+=dt;
                const attackSwing=Math.sin(state.attackTime*20)*0.5;
                if(armR)armR.rotation.x=-1.5 + attackSwing;
                if(armL)armL.rotation.x=-0.3 + attackSwing*0.5;
                if(torso)torso.rotation.z=attackSwing*0.1;
                if(state.attackTime>.3){
                    state.type="idle";
                    state.attackTime=0;
                }
                break;
                
            case"hit":
                // Получение урона
                state.hitTime-=dt;
                const hitAmount=Math.min(state.hitTime/.3,1);
                if(torso)torso.rotation.z=(1-hitAmount)*0.3;
                if(head)head.rotation.z=(1-hitAmount)*0.2;
                if(state.hitTime<=0){
                    state.type="idle";
                    state.hitTime=0;
                }
                break;
                
            default: // idle
                // Стояние с дыханием
                const breathe=Math.sin(time*2)*0.02;
                if(torso)torso.position.y=1.55 + breathe;
                if(head)head.position.y=2.7*1.1 + breathe*0.5;
                if(armL)armL.rotation.x=0.35 + breathe*0.5;
                if(armR)armR.rotation.x=-0.35 - breathe*0.5;
                if(legL)legL.rotation.x=breathe*0.3;
                if(legR)legR.rotation.x=-breathe*0.3;
                break;
        }
    }
}

function createTracer(from,to,colorHex=0x8a9a5b,duration=.15){
    const geo=new THREE.BufferGeometry().setFromPoints([from.clone(),to.clone()]);
    const mat=new THREE.LineBasicMaterial({color:colorHex,linewidth:2,transparent:true});

function getAimRaycaster(offsetX=0,offsetY=0){
    const euler=new THREE.Euler(player.pitch,player.yaw,0,"YXZ");
    camera.quaternion.setFromEuler(euler);
    camera.position.copy(player.pos);
    camera.updateMatrixWorld(true);
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    if(offsetX!==0||offsetY!==0){
        const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
        const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
        dir.addScaledVector(right,offsetX);
        dir.addScaledVector(up,offsetY);
        dir.normalize();
    }
    const raycaster=new THREE.Raycaster();
    raycaster.set(camera.position,dir);
    return raycaster;
}

function firePrimary(){
    if(!isPlaying)return;
    const w=weapons[currentWpnIdx];
    const now=performance.now()/1000;
    if(now-w.last<w.cooldown)return;
    w.last=now;
    const raycaster=getAimRaycaster();
    
    switch(w.type){
        case"revolver":

            checkHitscan(raycaster,35,"REVOLVER",0x8a9a5b);

        case"shotgun":

                const sprY=(Math.random()-.5)*.1;
                checkHitscan(getAimRaycaster(sprX,sprY),18,"SHOTGUN",0xc9a227);
            }
            break;
        case"jackhammer":

            const hits=raycaster.intersectObjects(enemies.map(e=>e.mesh),true);
            const lookDir=raycaster.ray.direction.clone();
            player.vel.addScaledVector(lookDir,-28);

            }
            player.isGrounded=false;
            if(hits.length>0&&hits[0].distance<5.5){
                const enemy=getEnemyFromMesh(hits[0].object);

                    addStyle(180,enemy.type==="shield"?"SHIELD BREAK":"JACKHAMMER IMPACT");
                    flashScreen(0xc9a227);
                    triggerHitStop(.3);
                }
            }
            break;
        case"nailgun":
            playSfx("shoot");
            checkHitscan(raycaster,12,"NAILGUN",0x4a6b6b);
            break;
        case"rail":
            fireRailcannon(raycaster);
            break;
        case"rocket":
            playSfx("shoot");
            const geo=new THREE.CylinderGeometry(.2,.2,1,8);
            geo.rotateX(Math.PI/2);
            const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x8b3a2f,wireframe:true}));
            const dir=raycaster.ray.direction.clone();
            mesh.position.copy(camera.position).addScaledVector(dir,2.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);
            scene.add(mesh);
            rockets.push({mesh,dir:dir.multiplyScalar(22),frozen:rocketsFrozen,canRide:false,enemyOwned:false});
            break;
        case"screwdriver":
            playSfx("jackhammer");
            const screwGeo=new THREE.CylinderGeometry(.03,.15,1.6,8);
            screwGeo.rotateX(Math.PI/2);
            const screwMesh=new THREE.Mesh(screwGeo,new THREE.MeshBasicMaterial({color:0xb8c4c9,wireframe:true}));
            const screwDir=raycaster.ray.direction.clone();
            screwMesh.position.copy(camera.position).addScaledVector(screwDir,1.5);
            screwMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),screwDir);
            scene.add(screwMesh);
            screws.push({mesh:screwMesh,dir:screwDir.clone(),origDir:screwDir.clone(),speed:SCREW_SPEED,state:"flying",embeddedIn:null,residualDamage:0});
            break;
        case"sharpshooter":
            playSfx("shoot");
            checkHitscan(raycaster,40,"SHARPSHOOTER",0xd8d3c4);
            break;
    }
}

function fireRailcannon(raycaster){
    playSfx("rail");
    flashScreen(0x8a9a5b);
    triggerHitStop(.1);
    let target=null;
    
    // Вражеские ракеты
    for(let i=0;i<rockets.length;i++){
        const r=rockets[i];
        if(r.enemyOwned&&raycaster.ray.distanceToPoint(r.mesh.position)<2){
            target={type:"rocket",object:r,index:i};
            break;
        }
    }
    
    // Ядро-носитель
    if(!target){
        for(let i=0;i<enemies.length;i++){
            const e=enemies[i];
            if(e.type==="carrier"&&e.core){
                const coreWorld=e.core.getWorldPosition(new THREE.Vector3());
                if(raycaster.ray.distanceToPoint(coreWorld)<1.8){
                    target={type:"carrierCore",enemy:e,pos:coreWorld};
                    break;
                }
            }
        }
    }
    
    // Обычные cores
    if(!target){
        for(let i=0;i<cores.length;i++){
            const c=cores[i];
            if(raycaster.ray.distanceToPoint(c.mesh.position)<2.5){
                target={type:"core",object:c,index:i};
                break;
            }
        }
    }
    
    if(target){
        if(target.type==="rocket"){
            const pos=target.object.mesh.position.clone();
            scene.remove(target.object.mesh);
            rockets.splice(target.index,1);
            triggerCoreNuke(pos);
            addStyle(400,"ENEMY ROCKET NUKE");
            return;
        }
        if(target.type==="carrierCore"){
            triggerEnemyCoreNuke(target.enemy);
            return;
        }
        if(target.type==="core"){
            const pos=target.object.mesh.position.clone();
            scene.remove(target.object.mesh);
            cores.splice(target.index,1);
            triggerCoreNuke(pos);
            return;
        }
    }
    
    checkHitscan(raycaster,220,"RAILCANNON",0x8a9a5b);
}

// ============================================================
// SHARPSHOOTER ALT
// ============================================================

function fireSharpshooterBeam(raycaster){
    const now=performance.now()/1000;
    if(now-sharpshooterAltLast<1)return;
    sharpshooterAltLast=now;
    playSfx("rail");
    flashScreen(0x4a6b6b);
    triggerHitStop(.1);
    
    let origin=camera.position.clone();
    let dir=raycaster.ray.direction.clone();
    const maxBounces=3;
    const maxDist=140;
    const hitEnemies=new Set();
    
    for(let bounce=0; bounce<=maxBounces; bounce++){
        const ray=new THREE.Raycaster(origin,dir,0,maxDist);
        
        // Уничтожение снарядов
        for(let i=projectiles.length-1;i>=0;i--){
            const p=projectiles[i];
            if(ray.ray.distanceToPoint(p.mesh.position)<1.5){
                const pos=p.mesh.position.clone();
                scene.remove(p.mesh);
                projectiles.splice(i,1);
                createExplosion(pos,3,0x4a6b6b);
                addStyle(100,"PROJECTILE DESTROYED");
                triggerHitStop(.15);
            }
        }
        
        // Враги
        const enemyHits=ray.intersectObjects(enemies.map(e=>e.mesh),true);
        enemyHits.forEach(hit=>{
            const enemy=getEnemyFromMesh(hit.object);
            if(enemy&&!hitEnemies.has(enemy)){
                hitEnemies.add(enemy);
                enemy.takeDamage(45,"sharpshooter",hit.point);
                createParticles(hit.point,0x8b3a2f,4);
            }
        });
        
        // Рикошет
        const solidTargets=cityColliders.concat(coins.map(c=>c.mesh)).concat(cores.map(c=>c.mesh)).concat(rockets.map(r=>r.mesh));
        const solidHits=ray.intersectObjects(solidTargets,false);
        let endPoint=origin.clone().addScaledVector(dir,maxDist);
        let newDir=null;
        
        if(solidHits.length>0){
            const hit=solidHits[0];
            endPoint=hit.point;
            let normal;
            if(hit.face){
                normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
            }else{
                normal=hit.point.clone().sub(hit.object.position).normalize();
            }
            newDir=dir.clone().sub(normal.multiplyScalar(2*dir.dot(normal))).normalize();
        }
        
        createTracer(origin,endPoint,0x4a6b6b,.35);
        
        if(!newDir||bounce===maxBounces)break;
        origin=endPoint.clone().addScaledVector(newDir,.05);
        dir=newDir;
    }
    
    if(hitEnemies.size>0){
        addStyle(180*hitEnemies.size,"RICOCHET PIERCE");
    }
}

// ============================================================
// HITSCAN
// ============================================================

function checkHitscan(raycaster,damage,label,colorHex=0x8a9a5b){
    const startPos=camera.position.clone();
    let endPos=startPos.clone().addScaledVector(raycaster.ray.direction,100);
    
    // Монета
    const coinHits=raycaster.intersectObjects(coins.map(c=>c.mesh));
    if(coinHits.length>0){
        const coinMesh=coinHits[0].object;
        endPos=coinHits[0].point;
        createTracer(startPos,endPos,colorHex);
        const coinIdx=coins.findIndex(c=>c.mesh===coinMesh);
        if(coinIdx!==-1){
            const coinPos=coinMesh.position.clone();
            scene.remove(coinMesh);
            coins.splice(coinIdx,1);
            playSfx("parry");
            addStyle(250,"ULTRA RICHOSHOT");
            triggerHitStop(.15);
            
            let carrierTarget=null;
            enemies.forEach(e=>{
                if(e.type==="carrier"&&e.core){
                    const corePos=e.core.getWorldPosition(new THREE.Vector3());
                    if(corePos.distanceTo(coinPos)<2.5)carrierTarget=e;
                }
            });
            
            if(carrierTarget){
                triggerEnemyCoreNuke(carrierTarget);
            }else{
                let closestEnemy=null;
                let minDist=Infinity;
                enemies.forEach(e=>{
                    const d=e.mesh.position.distanceTo(coinPos);
                    if(d<minDist){minDist=d;closestEnemy=e;}
                });
                if(closestEnemy){
                    createTracer(coinPos,closestEnemy.mesh.position,0xc9a227);
                    closestEnemy.takeDamage(damage*2.5,"coin");
                    createExplosion(closestEnemy.mesh.position,1.2,0xc9a227);
                }
            }
            return;
        }
    }
    
    // Вражеская ракета
    for(let i=0;i<rockets.length;i++){
        const r=rockets[i];
        if(r.enemyOwned&&raycaster.ray.distanceToPoint(r.mesh.position)<1.8){
            endPos=r.mesh.position.clone();
            scene.remove(r.mesh);
            rockets.splice(i,1);
            createExplosion(endPos,7,0x8b3a2f);
            addStyle(180,"ENEMY ROCKET POP");
            createTracer(startPos,endPos,colorHex);
            return;
        }
    }
    
    // Ядро-носитель
    for(let i=0;i<enemies.length;i++){
        const e=enemies[i];
        if(e.type==="carrier"&&e.core){
            const corePos=e.core.getWorldPosition(new THREE.Vector3());
            if(raycaster.ray.distanceToPoint(corePos)<1.8){
                triggerEnemyCoreNuke(e);
                createTracer(startPos,corePos,colorHex);
                return;
            }
        }
    }
    
    // Игровые ядра
    for(let i=0;i<cores.length;i++){
        const c=cores[i];
        if(raycaster.ray.distanceToPoint(c.mesh.position)<1.8){
            endPos=c.mesh.position.clone();
            scene.remove(c.mesh);
            cores.splice(i,1);
            createExplosion(endPos,6,0x4a6b6b);
            addStyle(150,"CORE POP");
            createTracer(startPos,endPos,colorHex);
            return;
        }
    }
    
    // Враги
    const hits=raycaster.intersectObjects(enemies.map(e=>e.mesh),true);
    if(hits.length>0){
        endPos=hits[0].point;
        const enemy=getEnemyFromMesh(hits[0].object);
        if(enemy){
            if(enemy.type==="carrier"&&hits[0].object.name==="enemyCore"){
                enemy.takeDamage(damage*2,"core",hits[0].point);
            }else{
                enemy.takeDamage(damage,label.toLowerCase(),hits[0].point);
            }
        }
    }
    
    createTracer(startPos,endPos,colorHex);
}

function triggerCoreNuke(pos){

function triggerEnemyCoreNuke(enemy){

    const pos=enemy.mesh.position.clone();
    playSfx("explosion");
    createExplosion(pos,24,0x48a6a6);
    addStyle(750,"ENEMY CORE NUKE");
    flashScreen(0x48a6a6);
    triggerHitStop(.3);
    enemies.slice().forEach(e=>{
        if(e!==enemy&&e.mesh.position.distanceTo(pos)<24){

// ============================================================
// ПАРИРОВАНИЕ
// ============================================================

function doParry(){
    if(!isPlaying)return;
    playSfx("parry");
    triggerHitStop(.3);
    let parried=false;
    
    // Парирование снарядов
    projectiles.forEach(p=>{
        if(p.mesh.position.distanceTo(player.pos)<5){
            parried=true;
            const pos=p.mesh.position.clone();
            scene.remove(p.mesh);
            projectiles=projectiles.filter(pr=>pr!==p);
            addStyle(250,p.turretShot?"SNIPER PARRY":"PROJECTILE PARRY");
            
            if(p.turretShot){
                const dir=new THREE.Vector3().subVectors(camera.position,pos).normalize();
                createTracer(pos,pos.clone().addScaledVector(dir,80),0xc9a227,.3);
                enemies.slice().forEach(e=>{
                    if(e.type==="turret"||e.type==="drone")return;
                    if(e.mesh.position.distanceTo(pos)<5){
                        e.takeDamage(180,"parry");
                    }
                });
            }
        }
    });
    
    // Сверло
    screws.forEach(s=>{
        if(s.state==="stuck"&&s.embeddedIn&&enemies.includes(s.embeddedIn)&&
           s.mesh.position.distanceTo(player.pos)<5){
            parried=true;
            const host=s.embeddedIn;
            host.takeDamage(s.residualDamage,"screw");
            addStyle(300,"SCREW RELEASE");
            if(enemies.includes(host)){
                s.state="flying";
                s.embeddedIn=null;
                s.dir=s.origDir.clone();
                s.speed=SCREW_SPEED;
                s.mesh.position.addScaledVector(s.dir,.5);
            }else{
                scene.remove(s.mesh);
                s.state="gone";
            }
        }
    });
    screws=screws.filter(s=>s.state!=="gone");
    
    // Вражеские ракеты
    rockets.forEach(r=>{
        if(r.enemyOwned&&r.mesh.position.distanceTo(player.pos)<5){
            parried=true;
            r.enemyOwned=false;
            r.frozen=true;
            r.canRide=true;
            r.dir.negate();
            addStyle(300,"ENEMY ROCKET PARRY");
        }
    });
    
    // Ближний бой врагов
    enemies.forEach(e=>{
        if(!e.dead){
            const dist=e.mesh.position.distanceTo(player.pos);
            if(dist<3 && e.animState.type==="attack"){
                parried=true;
                addStyle(150,"MELEE PARRY");
                e.takeDamage(50,"parry");
                e.staggerTimer=.5;
                e.animState.type="hit";
                e.animState.hitTime=.5;
                triggerHitStop(.2);
            }
        }
    });
    
    if(parried){
        player.hp=Math.min(player.maxHp,player.hp+35);
        updateHpUI();
        flashScreen(0xc9a227);
    }
}

// ============================================================
// ВЗРЫВЫ
// ============================================================

function createExplosion(pos,radius,colorHex){
    const geo=new THREE.SphereGeometry(radius,10,10);
    const mat=new THREE.MeshBasicMaterial({color:colorHex,wireframe:true});
    const sphere=new THREE.Mesh(geo,mat);
    sphere.position.copy(pos);
    scene.add(sphere);
    const pDist=player.pos.distanceTo(pos);
    if(pDist<radius*1.5){
        const pushDir=new THREE.Vector3().subVectors(player.pos,pos);
        if(pushDir.lengthSq()>0){
            pushDir.normalize();
            pushDir.y=Math.max(.3,pushDir.y);
            const force=(1-pDist/(radius*1.5))*32;
            player.vel.addScaledVector(pushDir,force);
            player.isGrounded=false;
        }
    }
    setTimeout(()=>scene.remove(sphere),250);
}

// ============================================================
// ЧАСТИЦЫ
// ============================================================

function createParticles(pos,color,count){
    for(let i=0;i<count;i++){
        const p=new THREE.Mesh(
            new THREE.BoxGeometry(.2,.2,.2),
            new THREE.MeshBasicMaterial({color})
        );
        p.position.copy(pos);
        p.vel=new THREE.Vector3((Math.random()-.5)*8,Math.random()*5,(Math.random()-.5)*8);
        scene.add(p);
        particles.push(p);
    }
}

// ============================================================
// ВСПЫШКА
// ============================================================

function flashScreen(colorHex){
    const el=document.getElementById("flash-screen");
    el.style.background="#"+colorHex.toString(16).padStart(6,"0");
    el.style.opacity=".5";
    setTimeout(()=>el.style.opacity="0",80);
}

// ============================================================
// СТИЛЬ
// ============================================================

function addStyle(pts,name){
    score+=pts*combo;
    combo=Math.min(5,combo+.1);
    document.getElementById("style-score").innerText=`${Math.floor(score)} PTS`;
    const ranks=["D","C","B","A","S","SS","SSS","ULTRAKILL"];
    const rIdx=Math.min(ranks.length-1,Math.floor(score/800));
    document.getElementById("style-rank").innerText=ranks[rIdx];
    const feed=document.getElementById("style-feed");
    const item=document.createElement("div");
    item.className="feed-item";
    item.innerText=`+${pts} ${name}`;
    feed.prepend(item);
    setTimeout(()=>item.remove(),1200);
}

// ============================================================
// ИГРОК
// ============================================================

function damagePlayer(amount){
    player.hp-=amount;
    player.hp=Math.max(0,player.hp);
    updateHpUI();
    flashScreen(0x8b3a2f);
    if(player.hp<=0){
        isPlaying=false;
        document.getElementById("final-score").textContent=Math.floor(score);
        document.getElementById("game-over").classList.add("show");
    }
}

function updateHpUI(){
    document.getElementById("hp-val").innerText=Math.max(0,Math.ceil(player.hp));
    document.getElementById("hp-fill").style.width=`${Math.max(0,player.hp/player.maxHp*100)}%`;
}

// ============================================================
// ПОИСК ВРАГА ПО МЕШУ
// ============================================================

function getEnemyFromMesh(obj){
    let current=obj;
    while(current){
        const enemy=enemies.find(e=>e.mesh===current);
        if(enemy)return enemy;
        current=current.parent;
    }
    return null;
}

// ============================================================
// СПАВН
// ============================================================

function spawnEnemy(type,x,z){
    enemies.push(new Enemy(type,new THREE.Vector3(x,0,z)));
}

function spawnWave(){
    wave++;
    enemiesKilledThisWave=0;
    document.getElementById("wave-val").innerText=wave;
    
    const scale=Math.min(1+wave*.08,2);
    
    // Базовые
    spawnEnemy("zombie",-6,-12);
    spawnEnemy("spitter",8,-16);
    spawnEnemy("brute",0,-22);
    
    // Щитовик
    if(wave>=1) spawnEnemy("shield",-10,-24);
    
    // Смертник
    if(wave>=1) spawnEnemy("bloater",12,-28);
    
    // Ракетчик
    if(wave>=2) spawnEnemy("rocketeer",-18,-30);
    
    // Дрон
    if(wave>=2) spawnEnemy("drone",15,-20);
    
    // Турель
    if(wave>=2) spawnEnemy("turret",28,-38);
    
    // Носитель ядра
    if(wave>=3) spawnEnemy("carrier",-28,-42);
    
    // Рой
    const swarmCount=Math.min(4+wave,12);
    for(let i=0;i<swarmCount;i++){
        const angle=i/swarmCount*Math.PI*2;
        spawnEnemy("swarm",Math.cos(angle)*(8+Math.random()*8),-25+Math.sin(angle)*8);
    }
}

// ============================================================
// СОБЫТИЯ
// ============================================================

function selectWeapon(idx){
    currentWpnIdx=idx;
    document.getElementById("weapon-display").innerText=weapons[currentWpnIdx].name;
    document.querySelectorAll(".wpn-btn").forEach((btn,i)=>{
        if(i===idx) btn.classList.add("active");
        else btn.classList.remove("active");
    });
    if(weapons[currentWpnIdx].type!=="screwdriver") altHeld=false;
}

function setupEvents(){
    const jZone=document.getElementById("joystick-zone");
    const jKnob=document.getElementById("joystick-knob");
    jZone.touchId=null;
    
    document.querySelectorAll(".wpn-btn").forEach(btn=>{
        btn.addEventListener("touchstart",e=>{
            e.preventDefault();
            e.stopPropagation();
            const idx=parseInt(btn.getAttribute("data-idx"));
            selectWeapon(idx);
        },{passive:false});
        btn.addEventListener("click",e=>{
            e.preventDefault();
            const idx=parseInt(btn.getAttribute("data-idx"));
            selectWeapon(idx);
        });
    });
    
    jZone.addEventListener("touchstart",e=>{
        jZone.touchId=e.touches[0].identifier;
    },{passive:true});
    
    window.addEventListener("touchmove",e=>{
        for(let touch of e.changedTouches){
            if(touch.identifier===jZone.touchId){
                const rect=jZone.getBoundingClientRect();
                const dx=touch.clientX-(rect.left+rect.width/2);
                const dy=touch.clientY-(rect.top+rect.height/2);
                const dist=Math.min(35,Math.hypot(dx,dy));
                const angle=Math.atan2(dy,dx);
                moveVec.x=Math.cos(angle)*dist/35;
                moveVec.y=Math.sin(angle)*dist/35;
                jKnob.style.transform=`translate(${moveVec.x*20}px,${moveVec.y*20}px)`;
            }else if(touch.clientX>window.innerWidth/2&&touchLook.id===touch.identifier){
                const dx=touch.clientX-touchLook.x;
                const dy=touch.clientY-touchLook.y;
                if(!isNaN(dx)&&!isNaN(dy)){
                    player.yaw-=dx*.005;
                    player.pitch-=dy*.005;
                    player.pitch=Math.max(-1.4,Math.min(1.4,player.pitch));
                }
                touchLook.x=touch.clientX;
                touchLook.y=touch.clientY;
            }
        }
    },{passive:true});
    
    window.addEventListener("touchstart",e=>{
        for(let touch of e.changedTouches){
            if(touch.clientX>window.innerWidth/2&&touchLook.id===null){
                const btns=document.getElementById("buttons-zone").getBoundingClientRect();
                const wpnPanel=document.getElementById("weapon-selector").getBoundingClientRect();
                if((touch.clientX<btns.left||touch.clientY<btns.top)&&touch.clientX<wpnPanel.left){
                    touchLook.id=touch.identifier;
                    touchLook.x=touch.clientX;
                    touchLook.y=touch.clientY;
                }
            }
        }
    },{passive:true});
    
    const resetTouch=e=>{
        for(let touch of e.changedTouches){
            if(touch.identifier===jZone.touchId){
                jZone.touchId=null;
                moveVec={x:0,y:0};
                jKnob.style.transform="translate(0,0)";
            }
            if(touch.identifier===touchLook.id) touchLook.id=null;
        }
    };
    window.addEventListener("touchend",resetTouch);
    
    document.getElementById("btn-fire").addEventListener("touchstart",e=>{
        e.preventDefault();
        e.stopPropagation();
        firePrimary();
    },{passive:false});
    
    document.getElementById("btn-alt").addEventListener("touchstart",e=>{
        e.preventDefault();
        e.stopPropagation();
        altHeld=true;
        if(weapons[currentWpnIdx].type!=="screwdriver") fireAlt();
    },{passive:false});
    
    document.getElementById("btn-alt").addEventListener("touchend",e=>{
        e.preventDefault();
        e.stopPropagation();
        altHeld=false;
    },{passive:false});
    document.getElementById("btn-alt").addEventListener("touchcancel",()=>{altHeld=false;});
    
    document.getElementById("btn-parry").addEventListener("touchstart",e=>{
        e.preventDefault();
        e.stopPropagation();
        doParry();
    },{passive:false});
    
    document.getElementById("btn-jump").addEventListener("touchstart",e=>{
        e.preventDefault();
        e.stopPropagation();
        if(player.ridingRocket){
            const r=player.ridingRocket;
            r.canRide=false;
            player.ridingRocket=null;
            player.vel.y=16;
            player.pos.y+=1.5;
            player.isGrounded=false;
        }else if(player.isGrounded){
            player.vel.y=12;
            player.isGrounded=false;
        }
    },{passive:false});
    
    document.getElementById("btn-dash").addEventListener("touchstart",e=>{
        e.preventDefault();
        e.stopPropagation();
        const dir=getAimRaycaster().ray.direction.clone();
        dir.y=0;
        if(dir.lengthSq()>0){
            dir.normalize();
            player.vel.addScaledVector(dir,15);
        }
    },{passive:false});
    
    // Клавиатура
    document.addEventListener("keydown",(e)=>{
        if(e.key==='w'||e.key==='ArrowUp') moveVec.y=-1;
        if(e.key==='s'||e.key==='ArrowDown') moveVec.y=1;
        if(e.key==='a'||e.key==='ArrowLeft') moveVec.x=-1;
        if(e.key==='d'||e.key==='ArrowRight') moveVec.x=1;
        if(e.key===' '){
            e.preventDefault();
            if(player.ridingRocket){
                const r=player.ridingRocket;
                r.canRide=false;
                player.ridingRocket=null;
                player.vel.y=16;
                player.pos.y+=1.5;
                player.isGrounded=false;
            }else if(player.isGrounded){
                player.vel.y=12;
                player.isGrounded=false;
            }
        }
        if(e.key==='Shift'){
            const dir=getAimRaycaster().ray.direction.clone();
            dir.y=0;
            if(dir.lengthSq()>0){
                dir.normalize();
                player.vel.addScaledVector(dir,15);
            }
        }
        if(e.key>='1'&&e.key<='8'){
            selectWeapon(parseInt(e.key)-1);
        }
        if(e.key==='e'||e.key==='E') fireAlt();
        if(e.key==='f'||e.key==='F') doParry();
    });
    
    document.addEventListener("keyup",(e)=>{
        if(e.key==='w'||e.key==='ArrowUp') if(moveVec.y===-1) moveVec.y=0;
        if(e.key==='s'||e.key==='ArrowDown') if(moveVec.y===1) moveVec.y=0;
        if(e.key==='a'||e.key==='ArrowLeft') if(moveVec.x===-1) moveVec.x=0;
        if(e.key==='d'||e.key==='ArrowRight') if(moveVec.x===1) moveVec.x=0;
    });
    
    // Мышь
    let isPointerLocked=false;
    document.addEventListener("click",()=>{
        if(!isPointerLocked && isPlaying){
            document.body.requestPointerLock();
            isPointerLocked=true;
        }
    });
    document.addEventListener("pointerlockchange",()=>{
        isPointerLocked=!!document.pointerLockElement;
    });
    document.addEventListener("mousemove",(e)=>{
        if(document.pointerLockElement){
            player.yaw-=e.movementX*0.002;
            player.pitch-=e.movementY*0.002;
            player.pitch=Math.max(-1.4,Math.min(1.4,player.pitch));
        }
    });
    document.addEventListener("mousedown",(e)=>{
        if(e.button===0) firePrimary();
        if(e.button===2) fireAlt();
    });
    document.addEventListener("contextmenu",(e)=>e.preventDefault());
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================

let lastTime=performance.now();

function animate(){
    requestAnimationFrame(animate);
    const now=performance.now();
    let dt=Math.min((now-lastTime)/1000,.1);
    lastTime=now;
    
    // Hit-stop
    if(hitStopTimer>0){
        dt*=0.1;
        hitStopTimer-=dt*10;
        if(hitStopTimer<0) hitStopTimer=0;
    }
    
    if(isPlaying&&!isPaused){
        if(isNaN(player.pitch)) player.pitch=0;
        if(isNaN(player.yaw)) player.yaw=0;
        
        const euler=new THREE.Euler(player.pitch,player.yaw,0,"YXZ");
        camera.quaternion.setFromEuler(euler);
        
        // Движение игрока
        if(player.ridingRocket){
            const r=player.ridingRocket;
            if(!r.frozen) r.mesh.position.addScaledVector(r.dir,dt);
            player.pos.copy(r.mesh.position);
            player.pos.y+=1.2;
            player.vel.set(0,0,0);
        }else{
            const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            forward.y=0;
            if(forward.lengthSq()>0) forward.normalize();
            const side=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            side.y=0;
            if(side.lengthSq()>0) side.normalize();
            
            player.pos.addScaledVector(forward,-moveVec.y*14*dt);
            player.pos.addScaledVector(side,moveVec.x*14*dt);
            player.vel.y-=28*dt;
            player.vel.x*=Math.pow(.05,dt);
            player.vel.z*=Math.pow(.05,dt);
            player.pos.addScaledVector(player.vel,dt);
            
            if(player.pos.y<=2){
                player.pos.y=2;
                player.vel.y=0;
                player.isGrounded=true;
            }
        }
        
        camera.position.copy(player.pos);
        if(playerLight) playerLight.position.copy(player.pos);
        
        // Зум винтовки
        const wantZoom=altHeld&&weapons[currentWpnIdx].type==="screwdriver";
        const targetFov=wantZoom?40:75;
        if(Math.abs(camera.fov-targetFov)>.05){
            camera.fov+=(targetFov-camera.fov)*Math.min(1,dt*10);
            camera.updateProjectionMatrix();
        }
        
        // Обновление врагов
        enemies.forEach(e=>e.update(dt));
        
        // Снаряды
        for(let i=projectiles.length-1;i>=0;i--){
            const p=projectiles[i];
            p.mesh.position.addScaledVector(p.dir,dt);
            p.life-=dt;
            let hitPlayer=false;
            if(p.mesh.position.distanceTo(player.pos)<1.6){
                hitPlayer=true;
                damagePlayer(p.damage||12);
                createExplosion(p.mesh.position,3,0xa8c93a);
            }
            if(hitPlayer||p.life<=0){
                scene.remove(p.mesh);
                projectiles.splice(i,1);
            }
        }
        
        // Сверло
        for(let i=screws.length-1;i>=0;i--){
            const s=screws[i];
            if(s.state==="flying"){
                const prevPos=s.mesh.position.clone();
                const moveDist=s.speed*dt;
                let embedded=false;
                if(enemies.length>0){
                    const sweepRay=new THREE.Raycaster(prevPos,s.dir,0,moveDist+.3);
                    const hits=sweepRay.intersectObjects(enemies.map(e=>e.mesh),true);
                    if(hits.length>0){
                        const hit=hits[0];
                        const e=getEnemyFromMesh(hit.object);
                        if(e){
                            const impact=Math.round(SCREW_TOTAL_DAMAGE*SCREW_IMPACT_SHARE);
                            e.takeDamage(impact,"screw",hit.point);
                            createExplosion(hit.point,2,0xb8c4c9);
                            if(enemies.includes(e)){
                                s.state="stuck";
                                s.embeddedIn=e;
                                s.residualDamage=SCREW_TOTAL_DAMAGE-impact;
                                s.stuckOffset=hit.point.clone().sub(e.mesh.position);
                                s.mesh.position.copy(hit.point);
                                addStyle(90,"SCREW STUCK");
                            }else{
                                scene.remove(s.mesh);
                                s.state="gone";
                            }
                            embedded=true;
                        }
                    }
                }
                if(!embedded){
                    s.mesh.position.addScaledVector(s.dir,moveDist);
                    if(s.mesh.position.length()>120){
                        scene.remove(s.mesh);
                        s.state="gone";
                    }
                }
            }else if(s.state==="stuck"){
                if(!s.embeddedIn||!enemies.includes(s.embeddedIn)){
                    scene.remove(s.mesh);
                    s.state="gone";
                }else{
                    s.mesh.position.copy(s.embeddedIn.mesh.position).add(s.stuckOffset||new THREE.Vector3(0,1.4,0));
                }
            }
        }
        screws=screws.filter(s=>s.state!=="gone");
        
        // Монеты
        for(let i=coins.length-1;i>=0;i--){
            const c=coins[i];
            c.vel.y-=14*dt;
            c.mesh.position.addScaledVector(c.vel,dt);
            let coinExploded=false;
            
            for(let crIdx=cores.length-1;crIdx>=0;crIdx--){
                const cr=cores[crIdx];
                if(c.mesh.position.distanceTo(cr.mesh.position)<1.5&&!coinExploded){
                    coinExploded=true;
                    const pos=cr.mesh.position.clone();
                    createExplosion(pos,7,0xc9a227);
                    addStyle(200,"COIN CORE DETONATION");
                    scene.remove(cr.mesh);
                    cores.splice(crIdx,1);
                }
            }
            
            enemies.forEach(e=>{
                if(coinExploded||e.type!=="carrier"||!e.core)return;
                const corePos=e.core.getWorldPosition(new THREE.Vector3());
                if(c.mesh.position.distanceTo(corePos)<1.5){
                    coinExploded=true;
                    triggerEnemyCoreNuke(e);
                }
            });
            
            for(let rkIdx=rockets.length-1;rkIdx>=0;rkIdx--){
                const rk=rockets[rkIdx];
                if(c.mesh.position.distanceTo(rk.mesh.position)<1.5&&!coinExploded){
                    coinExploded=true;
                    const pos=rk.mesh.position.clone();
                    createExplosion(pos,8,0xc9a227);
                    addStyle(220,rk.enemyOwned?"COIN ENEMY ROCKET":"COIN ROCKET DETONATION");
                    if(player.ridingRocket===rk) player.ridingRocket=null;
                    scene.remove(rk.mesh);
                    rockets.splice(rkIdx,1);
                }
            }
            
            if(coinExploded||c.mesh.position.y<=0){
                scene.remove(c.mesh);
                coins.splice(i,1);
            }
        }
        
        // Ядра
        for(let i=cores.length-1;i>=0;i--){
            const c=cores[i];
            c.vel.y-=12*dt;
            c.mesh.position.addScaledVector(c.vel,dt);
            let exploded=false;
            if(c.mesh.position.y<=.2){
                exploded=true;
            }else{
                enemies.forEach(e=>{
                    if(c.mesh.position.distanceTo(e.mesh.position)<2){
                        exploded=true;
                        e.takeDamage(100,"core");
                    }
                });
            }
            if(exploded){
                createExplosion(c.mesh.position,6,0x4a6b6b);
                scene.remove(c.mesh);
                cores.splice(i,1);
            }
        }
        
        // Ракеты
        for(let i=rockets.length-1;i>=0;i--){
            const r=rockets[i];
            if(!r.frozen) r.mesh.position.addScaledVector(r.dir,dt);
            
            if(r.enemyOwned&&player.pos.distanceTo(r.mesh.position)<2){
                createExplosion(r.mesh.position,7,0x8b3a2f);
                damagePlayer(35);
                scene.remove(r.mesh);
                rockets.splice(i,1);
                continue;
            }
            
            const distToPlayer=player.pos.distanceTo(r.mesh.position);
            if(!r.canRide&&distToPlayer>3.5) r.canRide=true;
            
            if(!player.ridingRocket&&r.canRide&&r.frozen&&distToPlayer<2){
                player.ridingRocket=r;
                addStyle(r.enemyOwned?350:150,r.enemyOwned?"ENEMY ROCKET RIDE":"ROCKET RIDE");
            }
            
            for(let eIdx=enemies.length-1;eIdx>=0;eIdx--){
                const e=enemies[eIdx];
                if(e.mesh.position.distanceTo(r.mesh.position)<2.5){
                    createExplosion(r.mesh.position,6,0x8b3a2f);
                    e.takeDamage(120,"rocket");
                    if(player.ridingRocket===r) player.ridingRocket=null;
                    scene.remove(r.mesh);
                    rockets.splice(i,1);
                    break;
                }
            }
        }
        
        // Трассеры
        for(let i=tracers.length-1;i>=0;i--){
            const t=tracers[i];
            t.life-=dt;
            t.line.material.opacity=t.life/t.maxLife;
            if(t.life<=0){
                scene.remove(t.line);
                tracers.splice(i,1);
            }
        }
        
        // Частицы
        for(let i=particles.length-1;i>=0;i--){
            const p=particles[i];
            p.position.addScaledVector(p.vel,dt);
            p.scale.multiplyScalar(.92);
            if(p.scale.x<.02){
                scene.remove(p);
                particles.splice(i,1);
            }
        }
        
        // Новая волна
        if(enemies.length===0&&!wavePending){
            wavePending=true;
            setTimeout(()=>{
                wavePending=false;
                if(isPlaying&&enemies.length===0) spawnWave();
            },900);
        }
    }
    
    if(renderer&&scene&&camera) renderer.render(scene,camera);
}

document.getElementById("btn-start").addEventListener("click",()=>{
    if(isPlaying) return;
    document.getElementById("menu-overlay").classList.add("hidden");
    document.getElementById("hud").classList.remove("hidden");
    initEngine();
    isPlaying=true;
    animate();
});

document.getElementById("btn-retry").addEventListener("click",()=>{
    location.reload();
});
