<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRAKILL Mobile - Advanced Cyber Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #020204;
            font-family: 'Courier New', monospace;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #hud {
            position: absolute; top: 12px; left: 12px;
            color: #ff0055; text-shadow: 0 0 8px #ff0055, 0 0 2px #000;
            font-size: 14px; font-weight: bold;
            pointer-events: none; z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px; border: 1px solid #ff0055;
            border-radius: 4px;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px;
            border: 2px solid #00ffff; border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
            box-shadow: 0 0 8px #00ffff;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 4px; left: 4px;
            width: 2px; height: 2px; background: #00ffff;
        }
        
        /* Touch UI */
        .touch-zone { position: absolute; bottom: 20px; z-index: 20; }
        #joystick-zone {
            left: 20px; width: 130px; height: 130px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%; backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: radial-gradient(circle, #ff0055 0%, #a00035 100%);
            border: 2px solid #ff0055; border-radius: 50%;
            box-shadow: 0 0 10px #ff0055; pointer-events: none;
        }
        #action-buttons {
            right: 15px; display: grid;
            grid-template-columns: repeat(3, 62px); grid-gap: 8px;
        }
        .btn {
            width: 62px; height: 62px;
            background: rgba(10, 15, 25, 0.75);
            border: 2px solid #00ffff; color: #00ffff;
            font-weight: 900; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; text-shadow: 0 0 5px #00ffff;
            box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.2);
        }
        .btn:active { background: #00ffff; color: #000; text-shadow: none; }
        .btn-danger { border-color: #ff0055; color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        .btn-danger:active { background: #ff0055; color: #000; }
        
        #hitstop-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.25);
            mix-blend-mode: overlay; pointer-events: none;
            display: none; z-index: 15;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        HEALTH: <span id="hp-val">100</span><br>
        STYLE: <span id="style-val">ULTRAKILL</span><br>
        WEAPON: <span id="weapon-val" style="color:#00ffff;">Screwdriver</span><br>
        WAVE: <span id="wave-val">1</span> | TARGETS: <span id="enemy-val">0</span>
    </div>
    <div id="crosshair"></div>
    <div id="hitstop-overlay"></div>

    <div id="joystick-zone" class="touch-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="action-buttons" class="touch-zone">
        <div class="btn btn-danger" id="btn-shoot">FIRE</div>
        <div class="btn" id="btn-alt">ALT</div>
        <div class="btn btn-danger" id="btn-parry">PARRY</div>
        <div class="btn" id="btn-jump">JUMP</div>
        <div class="btn" id="btn-dash">DASH</div>
        <div class="btn" id="btn-swap">SWAP</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GLOBAL CONSTANTS & STATE ---
        let hitStopTimer = 0;
        let shakeIntensity = 0;

        const STATE = {
            hp: 100,
            style: 0,
            weaponIndex: 0,
            weapons: ['Screwdriver', 'Sharpshooter', 'Jackhammer', 'RocketLauncher', 'Shotgun', 'Nailgun', 'Railcannon'],
            freezeRockets: false,
            wave: 1
        };

        function triggerHitStop(duration = 0.3, shake = 0.4) {
            hitStopTimer = duration;
            shakeIntensity = shake;
            document.getElementById('hitstop-overlay').style.display = 'block';
        }

        // --- THREE.JS SYSTEM SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030306);
        scene.fog = new THREE.FogExp2(0x030306, 0.018);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff0055, 0.6);
        dirLight.position.set(30, 50, 20);
        scene.add(dirLight);

        const blueLight = new THREE.DirectionalLight(0x00ffff, 0.4);
        blueLight.position.set(-30, 20, -20);
        scene.add(blueLight);

        // --- ARENA GENERATION (Cyber Grid) ---
        const arenaSize = 90;
        const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize, 30, 30);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a10, roughness: 0.4, metalness: 0.8, wireframe: false
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(arenaSize, 40, 0xff0055, 0x00ffff);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const walls = [];
        function createDetailedWall(x, z, w, d) {
            const group = new THREE.Group();
            const wallGeo = new THREE.BoxGeometry(w, 18, d);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x08080d, roughness: 0.6, metalness: 0.5 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = 9;
            group.add(wall);

            // Neon Trim
            const trimGeo = new THREE.BoxGeometry(w + 0.2, 0.4, d + 0.2);
            const trimMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const trim = new THREE.Mesh(trimGeo, trimMat);
            trim.position.y = 17.8;
            group.add(trim);

            group.position.set(x, 0, z);
            scene.add(group);
            walls.push(wall);
        }

        createDetailedWall(0, -arenaSize/2, arenaSize, 3);
        createDetailedWall(0, arenaSize/2, arenaSize, 3);
        createDetailedWall(-arenaSize/2, 0, 3, arenaSize);
        createDetailedWall(arenaSize/2, 0, 3, arenaSize);
        createDetailedWall(-18, -18, 14, 14);
        createDetailedWall(18, 18, 16, 10);

        // --- PLAYER CONTROLS & CAMERA ---
        const player = {
            position: new THREE.Vector3(0, 1.6, 0),
            velocity: new THREE.Vector3(),
            rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
            onGround: false,
            ridingRocket: null
        };

        function updateViewport() {
            if (window.visualViewport) {
                renderer.setSize(window.visualViewport.width, window.visualViewport.height);
                camera.aspect = window.visualViewport.width / window.visualViewport.height;
                camera.updateProjectionMatrix();
            }
        }
        if (window.visualViewport) window.visualViewport.addEventListener('resize', updateViewport);

        const moveInput = { x: 0, y: 0 };
        let touchLookId = null, lastTouchX = 0, lastTouchY = 0;

        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        joyZone.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (joyTouchId === null) { joyTouchId = t.identifier; updateJoystick(t); }
            }
        });
        joyZone.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) { if (t.identifier === joyTouchId) updateJoystick(t); }
        });
        const resetJoy = () => {
            joyTouchId = null; moveInput.x = 0; moveInput.y = 0;
            joyKnob.style.left = '40px'; joyKnob.style.top = '40px';
        };
        joyZone.addEventListener('touchend', resetJoy);
        joyZone.addEventListener('touchcancel', resetJoy);

        function updateJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + 65);
            let dy = touch.clientY - (rect.top + 65);
            const dist = Math.hypot(dx, dy);
            const maxR = 45;
            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            joyKnob.style.left = (40 + dx) + 'px'; joyKnob.style.top = (40 + dy) + 'px';
            moveInput.x = dx / maxR; moveInput.y = dy / maxR;
        }

        window.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (t.clientX > window.innerWidth / 2 && touchLookId === null) {
                    touchLookId = t.identifier; lastTouchX = t.clientX; lastTouchY = t.clientY;
                }
            }
        });
        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchLookId) {
                    const dx = t.clientX - lastTouchX, dy = t.clientY - lastTouchY;
                    player.rotation.y -= dx * 0.0045;
                    player.rotation.x -= dy * 0.0045;
                    player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
                    lastTouchX = t.clientX; lastTouchY = t.clientY;
                }
            }
        });
        const resetLook = (e) => {
            for (let t of e.changedTouches) { if (t.identifier === touchLookId) touchLookId = null; }
        };
        window.addEventListener('touchend', resetLook);
        window.addEventListener('touchcancel', resetLook);

        // --- ARRAYS ---
        const enemies = [];
        const projectiles = [];
        const particles = [];

        // --- ADVANCED PARTICLES & VISUALS ---
        function createParticle(pos, color, scale = 0.25, speedMult = 1) {
            const p = new THREE.Mesh(
                new THREE.BoxGeometry(scale, scale, scale),
                new THREE.MeshBasicMaterial({ color: color })
            );
            p.position.copy(pos);
            p.userData = {
                vel: new THREE.Vector3((Math.random()-0.5)*12*speedMult, (Math.random()-0.5)*12*speedMult, (Math.random()-0.5)*12*speedMult),
                life: 0.45
            };
            scene.add(p);
            particles.push(p);
        }

        function createFlash(pos, color = 0xff0055, count = 12) {
            for (let i = 0; i < count; i++) createParticle(pos, color, 0.3, 1.2);
            const pLight = new THREE.PointLight(color, 3, 10);
            pLight.position.copy(pos);
            scene.add(pLight);
            setTimeout(() => scene.remove(pLight), 100);
        }

        // --- COMPLEX ENEMY BUILDERS ---
        class Enemy {
            constructor(type, pos) {
                this.type = type;
                this.hp = 100;
                this.isParryable = false;
                this.mesh = new THREE.Group();
                this.mesh.position.copy(pos);
                this.speed = 4.5;
                this.attackTimer = 0;
                this.parryFlashMesh = null;

                this.buildDetailedMesh();
                scene.add(this.mesh);
            }

            buildDetailedMesh() {
                const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.3, metalness: 0.8 });
                const redGlow = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const cyanGlow = new THREE.MeshBasicMaterial({ color: 0x00ffff });

                // Parry Indicator Orb
                const pGeo = new THREE.SphereGeometry(0.35, 8, 8);
                this.parryFlashMesh = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true }));
                this.parryFlashMesh.position.y = 2.8;
                this.parryFlashMesh.visible = false;
                this.mesh.add(this.parryFlashMesh);

                if (this.type === 'shielded') {
                    this.hp = 160;
                    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.8), darkMetal);
                    torso.position.y = 1.1;
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), redGlow);
                    head.position.set(0, 2.3, 0);

                    // Shield Geometry
                    const shieldGroup = new THREE.Group();
                    const sPlate = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.8, 0.15), new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, metalness: 0.9 }));
                    const sFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.0, 0.08), darkMetal);
                    shieldGroup.add(sPlate, sFrame);
                    shieldGroup.position.set(0, 1.4, 0.8);
                    this.shield = shieldGroup;

                    this.mesh.add(torso, head, shieldGroup);
                } else if (this.type === 'bloater') {
                    this.hp = 80; this.speed = 3.0;
                    const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1.3, 1), new THREE.MeshStandardMaterial({ color: 0x228822, roughness: 0.9 }));
                    body.position.y = 1.3;
                    const core = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
                    core.position.y = 1.3;
                    this.mesh.add(body, core);
                } else if (this.type === 'rocketeer') {
                    this.hp = 130;
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 2.2, 6), darkMetal);
                    body.position.y = 1.1;
                    // Double Shoulder Launchers
                    const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.5), darkMetal); l1.position.set(0.8, 1.8, 0);
                    const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.5), darkMetal); l2.position.set(-0.8, 1.8, 0);
                    this.mesh.add(body, l1, l2);
                } else if (this.type === 'screamer') {
                    this.hp = 70; this.mesh.position.y = 4.5;
                    const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), darkMetal);
                    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.08, 8, 20), cyanGlow);
                    ring.rotation.x = Math.PI/2;
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), redGlow);
                    eye.position.z = 0.8;
                    this.mesh.add(core, ring, eye);
                } else if (this.type === 'turret') {
                    this.hp = 100;
                    // Spider Legs + Sniper Head
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 0.6, 6), darkMetal);
                    base.position.y = 0.8;
                    for (let i = 0; i < 4; i++) {
                        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.15), darkMetal);
                        leg.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.6;
                        leg.rotation.y = (i < 2 ? 1 : -1) * 0.8;
                        leg.position.set((i % 2 === 0 ? 0.8 : -0.8), 0.4, (i < 2 ? 0.8 : -0.8));
                        this.mesh.add(leg);
                    }
                    const sniperHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 2.2), darkMetal);
                    sniperHead.position.set(0, 1.3, 0.4);
                    const laserLens = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), redGlow);
                    laserLens.position.set(0, 1.3, 1.5);
                    this.mesh.add(base, sniperHead, laserLens);
                } else if (this.type === 'swarmer') {
                    this.hp = 25; this.speed = 8.0;
                    const body = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5), redGlow);
                    body.position.y = 0.5;
                    this.mesh.add(body);
                } else if (this.type === 'core_carrier') {
                    this.hp = 220;
                    const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.2, 1.6), darkMetal);
                    body.position.y = 1.6;
                    this.core = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 12), cyanGlow);
                    this.core.position.set(0, 1.8, 0.85);
                    this.mesh.add(body, this.core);
                }
            }

            update(delta) {
                const dirToPlayer = new THREE.Vector3().subVectors(player.position, this.mesh.position);
                const dist = dirToPlayer.length();
                dirToPlayer.y = 0; dirToPlayer.normalize();

                this.attackTimer += delta;
                this.parryFlashMesh.visible = this.isParryable;

                if (this.type === 'shielded') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    this.mesh.lookAt(player.position.x, this.mesh.position.y, player.position.z);
                    if (dist < 2.8 && this.attackTimer > 2.2) {
                        this.isParryable = true;
                        if (dist < 2.2) {
                            STATE.hp -= 20; this.attackTimer = 0; this.isParryable = false;
                            triggerHitStop(0.1, 0.3);
                        }
                    }
                } else if (this.type === 'bloater') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    if (dist < 2.8) this.explode();
                } else if (this.type === 'rocketeer') {
                    this.mesh.lookAt(player.position.x, this.mesh.position.y, player.position.z);
                    if (this.attackTimer > 3.2) {
                        this.isParryable = true;
                        if (this.attackTimer > 3.6) {
                            const rPos = this.mesh.position.clone().add(new THREE.Vector3(0, 1.8, 0));
                            const rDir = new THREE.Vector3().subVectors(player.position, rPos).normalize();
                            projectiles.push(new Rocket(rPos, rDir, false));
                            this.attackTimer = 0; this.isParryable = false;
                        }
                    }
                } else if (this.type === 'screamer') {
                    this.mesh.position.x += Math.sin(Date.now()*0.004) * 0.08;
                    this.mesh.lookAt(player.position);
                    if (this.attackTimer > 2.5) {
                        this.isParryable = true;
                        if (this.attackTimer > 3.1) {
                            STATE.hp -= 12; this.attackTimer = 0; this.isParryable = false;
                            createFlash(player.position, 0xff0055, 6);
                        }
                    }
                } else if (this.type === 'turret') {
                    this.mesh.lookAt(player.position);
                    if (this.attackTimer > 3.8) {
                        this.isParryable = true;
                        if (this.attackTimer > 4.3) {
                            STATE.hp -= 35; this.attackTimer = 0; this.isParryable = false;
                            triggerHitStop(0.15, 0.5);
                        }
                    }
                } else if (this.type === 'swarmer') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    if (dist < 1.3) { STATE.hp -= 6; this.takeDamage(100); }
                } else if (this.type === 'core_carrier') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * 0.4 * delta);
                    if (this.attackTimer > 3.5) {
                        this.isParryable = true;
                        this.core.material.color.setHex(0xff0055);
                        if (this.attackTimer > 4.5) {
                            this.core.material.color.setHex(0x00ffff);
                            this.attackTimer = 0; this.isParryable = false;
                        }
                    }
                }
            }

            takeDamage(amount, hitDir = null, isFront = false) {
                if (this.type === 'shielded' && isFront) {
                    createFlash(this.mesh.position, 0x00ffff, 10);
                    return;
                }
                this.hp -= amount;
                createFlash(this.mesh.position, 0xff0055, 8);
                if (this.hp <= 0) this.die();
            }

            die() {
                if (this.type === 'bloater') this.explode();
                scene.remove(this.mesh);
                const idx = enemies.indexOf(this);
                if (idx > -1) enemies.splice(idx, 1);
                STATE.style += 120;
            }

            explode() {
                createFlash(this.mesh.position, 0xff5500, 25);
                triggerHitStop(0.2, 0.6);
                if (player.position.distanceTo(this.mesh.position) < 7) STATE.hp -= 40;
                enemies.forEach(e => {
                    if (e !== this && e.type === 'bloater' && e.mesh.position.distanceTo(this.mesh.position) < 7) {
                        e.takeDamage(100);
                    }
                });
            }
        }

        // --- ROCKET CLASS ---
        class Rocket {
            constructor(pos, dir, isPlayer = true) {
                this.mesh = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9), new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00ffff : 0xff0055 }));
                body.rotation.x = Math.PI/2;
                this.mesh.add(body);
                this.mesh.position.copy(pos);
                this.dir = dir.clone();
                this.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), this.dir);
                this.isPlayer = isPlayer;
                this.speed = 28;
                scene.add(this.mesh);
            }

            update(delta) {
                if (STATE.freezeRockets) return;
                this.mesh.position.addScaledVector(this.dir, this.speed * delta);
                createParticle(this.mesh.position, this.isPlayer ? 0x00ffff : 0xff5500, 0.15);

                if (player.ridingRocket === this) {
                    player.position.copy(this.mesh.position).add(new THREE.Vector3(0, 1.3, 0));
                }

                if (this.mesh.position.distanceTo(player.position) < 1.6 && !this.isPlayer) {
                    STATE.hp -= 30; this.destroy();
                }
                enemies.forEach(e => {
                    if (this.mesh.position.distanceTo(e.mesh.position) < 1.8) {
                        e.takeDamage(95); this.destroy();
                    }
                });
            }

            destroy() {
                if (player.ridingRocket === this) player.ridingRocket = null;
                createFlash(this.mesh.position, 0xffaa00, 16);
                scene.remove(this.mesh);
                const idx = projectiles.indexOf(this);
                if (idx > -1) projectiles.splice(idx, 1);
            }
        }

        // --- PARRY MECHANIC ---
        function doParry() {
            let parried = false;
            enemies.forEach(e => {
                if (player.position.distanceTo(e.mesh.position) < 4.2 && e.isParryable) {
                    e.takeDamage(110); e.isParryable = false; parried = true;
                }
            });
            projectiles.forEach(p => {
                if (!p.isPlayer && player.position.distanceTo(p.mesh.position) < 4.0) {
                    p.dir.negate(); p.isPlayer = true; p.speed *= 1.6; parried = true;
                }
            });
            if (parried) {
                STATE.hp = Math.min(100, STATE.hp + 35);
                triggerHitStop(0.3, 0.7);
            }
        }

        // --- WEAPONS SYSTEM ---
        function shootWeapon() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const currentWpn = STATE.weapons[STATE.weaponIndex];

            if (currentWpn === 'Screwdriver') {
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !(obj.parent instanceof THREE.Scene)) obj = obj.parent;
                    const enemy = enemies.find(e => e.mesh === obj);
                    if (enemy) {
                        const forward = new THREE.Vector3();
                        enemy.mesh.getWorldDirection(forward);
                        const isFront = raycaster.ray.direction.angleTo(forward) > Math.PI / 2;
                        enemy.takeDamage(55, raycaster.ray.direction, isFront);
                    }
                }
            } else if (currentWpn === 'Sharpshooter') {
                let ray = raycaster.ray.clone();
                for (let bounce = 0; bounce < 3; bounce++) {
                    const hits = raycaster.intersectObjects([...walls, ...enemies.map(e => e.mesh)], true);
                    if (hits.length > 0) {
                        const hit = hits[0];
                        createFlash(hit.point, 0x00ffff, 8);
                        let obj = hit.object;
                        while (obj.parent && !(obj.parent instanceof THREE.Scene)) obj = obj.parent;
                        const enemy = enemies.find(e => e.mesh === obj);
                        if (enemy) { enemy.takeDamage(50); break; }
                        else {
                            ray.origin.copy(hit.point);
                            ray.direction.reflect(hit.face.normal);
                            raycaster.ray.copy(ray);
                        }
                    } else break;
                }
            } else if (currentWpn === 'Jackhammer') {
                let hitAny = false;
                enemies.forEach(e => {
                    if (player.position.distanceTo(e.mesh.position) < 3.8) {
                        e.takeDamage(95, null, false);
                        const pushDir = new THREE.Vector3().subVectors(e.mesh.position, player.position).normalize();
                        e.mesh.position.addScaledVector(pushDir, 5);
                        hitAny = true;
                    }
                });
                if (hitAny) triggerHitStop(0.3, 0.8);
            } else if (currentWpn === 'RocketLauncher') {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                projectiles.push(new Rocket(player.position.clone().add(dir), dir, true));
            } else if (currentWpn === 'Shotgun') {
                for (let i = 0; i < 7; i++) {
                    const spreadDir = raycaster.ray.direction.clone().add(new THREE.Vector3((Math.random()-0.5)*0.25, (Math.random()-0.5)*0.25, (Math.random()-0.5)*0.25)).normalize();
                    const spreadRay = new THREE.Raycaster(player.position, spreadDir);
                    const hits = spreadRay.intersectObjects(enemies.map(e => e.mesh), true);
                    if (hits.length > 0) {
                        let obj = hits[0].object;
                        while (obj.parent && !(obj.parent instanceof THREE.Scene)) obj = obj.parent;
                        const enemy = enemies.find(e => e.mesh === obj);
                        if (enemy) enemy.takeDamage(18);
                    }
                }
            } else if (currentWpn === 'Nailgun') {
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !(obj.parent instanceof THREE.Scene)) obj = obj.parent;
                    const enemy = enemies.find(e => e.mesh === obj);
                    if (enemy) enemy.takeDamage(14);
                }
            } else if (currentWpn === 'Railcannon') {
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !(obj.parent instanceof THREE.Scene)) obj = obj.parent;
                    const enemy = enemies.find(e => e.mesh === obj);
                    if (enemy) {
                        if (enemy.type === 'core_carrier' && enemy.isParryable) {
                            createFlash(enemy.mesh.position, 0x00ffff, 35);
                            triggerHitStop(0.3, 1.0);
                            enemies.forEach(e => {
                                if (e.mesh.position.distanceTo(enemy.mesh.position) < 14) e.takeDamage(300);
                            });
                        } else enemy.takeDamage(160);
                    }
                }
            }
        }

        // --- CONTROLS BINDING ---
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });
        document.getElementById('btn-parry').addEventListener('touchstart', (e) => { e.preventDefault(); doParry(); });
        document.getElementById('btn-alt').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (STATE.weapons[STATE.weaponIndex] === 'RocketLauncher') STATE.freezeRockets = !STATE.freezeRockets;
        });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.onGround) player.velocity.y = 13;
            projectiles.forEach(p => {
                if (p.mesh.position.distanceTo(player.position) < 2.2) player.ridingRocket = p;
            });
        });
        document.getElementById('btn-dash').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
            player.position.addScaledVector(dir, 6);
        });
        document.getElementById('btn-swap').addEventListener('touchstart', (e) => {
            e.preventDefault();
            STATE.weaponIndex = (STATE.weaponIndex + 1) % STATE.weapons.length;
            document.getElementById('weapon-val').innerText = STATE.weapons[STATE.weaponIndex];
        });

        // --- WAVE SPAWNER ---
        function spawnWave() {
            const types = ['shielded', 'bloater', 'rocketeer', 'screamer', 'turret', 'swarmer', 'core_carrier'];
            types.forEach(t => {
                const pos = new THREE.Vector3((Math.random()-0.5)*60, 0, (Math.random()-0.5)*60);
                enemies.push(new Enemy(t, pos));
            });
            for(let i=0; i<5; i++) {
                enemies.push(new Enemy('swarmer', new THREE.Vector3((Math.random()-0.5)*50, 0, (Math.random()-0.5)*50)));
            }
        }
        spawnWave();

        // --- LOOP & RENDER ---
        let lastTime = performance.now();

        function animate(time) {
            requestAnimationFrame(animate);
            const delta = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // Hit-Stop logic
            if (hitStopTimer > 0) {
                hitStopTimer -= delta;
                if (hitStopTimer <= 0) document.getElementById('hitstop-overlay').style.display = 'none';
                renderer.render(scene, camera);
                return;
            }

            // Movement Physics
            const moveDir = new THREE.Vector3(moveInput.x, 0, moveInput.y);
            moveDir.applyEuler(new THREE.Euler(0, player.rotation.y, 0));

            if (!player.ridingRocket) {
                player.position.addScaledVector(moveDir, 11 * delta);
                player.velocity.y -= 28 * delta;
                player.position.y += player.velocity.y * delta;
                if (player.position.y <= 1.6) {
                    player.position.y = 1.6; player.velocity.y = 0; player.onGround = true;
                } else player.onGround = false;
            }

            // Camera Shake Offset
            camera.position.copy(player.position);
            if (shakeIntensity > 0) {
                camera.position.x += (Math.random()-0.5) * shakeIntensity;
                camera.position.y += (Math.random()-0.5) * shakeIntensity;
                shakeIntensity -= delta * 2;
            }
            camera.rotation.copy(player.rotation);

            // Entities update
            enemies.forEach(e => e.update(delta));
            projectiles.forEach(p => p.update(delta));

            // Particles update
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.userData.vel, delta);
                p.userData.life -= delta;
                if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }

            // Wave progression
            if (enemies.length === 0) { STATE.wave++; spawnWave(); }

            // HUD
            document.getElementById('hp-val').innerText = Math.max(0, Math.floor(STATE.hp));
            document.getElementById('style-val').innerText = STATE.style;
            document.getElementById('wave-val').innerText = STATE.wave;
            document.getElementById('enemy-val').innerText = enemies.length;

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
