<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRAKILL Mobile - Expanded Bestiary</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055;
            font-size: 16px;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        /* Virtual Touch Controls */
        .touch-zone {
            position: absolute;
            bottom: 20px;
            z-index: 20;
        }
        #joystick-zone {
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 85, 0.6);
            border-radius: 25px;
            pointer-events: none;
        }
        #action-buttons {
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 10px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-shadow: 0 0 4px #000;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.6);
        }
        #hitstop-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            display: none;
            z-index: 15;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        HP: <span id="hp-val">100</span> | STYLE: <span id="style-val">ULTRAKILL</span><br>
        WEAPON: <span id="weapon-val">Screwdriver</span><br>
        WAVE: <span id="wave-val">1</span> | ENEMIES: <span id="enemy-val">0</span>
    </div>
    <div id="crosshair"></div>
    <div id="hitstop-overlay"></div>

    <div id="joystick-zone" class="touch-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="action-buttons" class="touch-zone">
        <div class="btn" id="btn-shoot">FIRE</div>
        <div class="btn" id="btn-alt">ALT</div>
        <div class="btn" id="btn-parry">PARRY</div>
        <div class="btn" id="btn-jump">JUMP</div>
        <div class="btn" id="btn-dash">DASH</div>
        <div class="btn" id="btn-swap">SWAP</div>
    </div>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GAME STATE & CONSTANTS ---
        const SCREW_SPEED = 92;
        let hitStopTimer = 0;

        const STATE = {
            hp: 100,
            style: 0,
            weaponIndex: 0,
            weapons: ['Screwdriver', 'Sharpshooter', 'Jackhammer', 'RocketLauncher', 'Shotgun', 'Nailgun', 'Railcannon'],
            freezeRockets: false,
            wave: 1
        };

        // --- HIT-STOP SYSTEM ---
        function triggerHitStop(duration = 0.3) {
            hitStopTimer = duration;
            document.getElementById('hitstop-overlay').style.display = 'block';
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- MAP GENERATION ---
        const arenaSize = 80;
        const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const walls = [];
        function createWall(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, 15, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0x111115 });
            const wall = new THREE.Mesh(geo, mat);
            wall.position.set(x, 7.5, z);
            scene.add(wall);
            walls.push(wall);
        }
        createWall(0, -arenaSize/2, arenaSize, 2);
        createWall(0, arenaSize/2, arenaSize, 2);
        createWall(-arenaSize/2, 0, 2, arenaSize);
        createWall(arenaSize/2, 0, 2, arenaSize);
        createWall(-15, -15, 10, 10);
        createWall(15, 15, 12, 8);

        // --- PLAYER OBJECT & CONTROLS ---
        const player = {
            position: new THREE.Vector3(0, 1.6, 0),
            velocity: new THREE.Vector3(),
            rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
            onGround: false,
            ridingRocket: null
        };
        camera.position.copy(player.position);

        // Mobile Visual Viewport Adjustment
        function updateViewport() {
            if (window.visualViewport) {
                renderer.setSize(window.visualViewport.width, window.visualViewport.height);
                camera.aspect = window.visualViewport.width / window.visualViewport.height;
                camera.updateProjectionMatrix();
            }
        }
        if (window.visualViewport) window.visualViewport.addEventListener('resize', updateViewport);

        // Input Systems
        const moveInput = { x: 0, y: 0 };
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;

        // Joystick Setup
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;
        const joyCenter = { x: 60, y: 60 };

        joyZone.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (joyTouchId === null) {
                    joyTouchId = t.identifier;
                    updateJoystick(t);
                }
            }
        });

        joyZone.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === joyTouchId) updateJoystick(t);
            }
        });

        const resetJoy = () => {
            joyTouchId = null;
            moveInput.x = 0; moveInput.y = 0;
            joyKnob.style.left = '35px';
            joyKnob.style.top = '35px';
        };
        joyZone.addEventListener('touchend', resetJoy);
        joyZone.addEventListener('touchcancel', resetJoy);

        function updateJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + 60);
            let dy = touch.clientY - (rect.top + 60);
            const dist = Math.hypot(dx, dy);
            const maxR = 40;
            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            joyKnob.style.left = (35 + dx) + 'px';
            joyKnob.style.top = (35 + dy) + 'px';
            moveInput.x = dx / maxR;
            moveInput.y = dy / maxR;
        }

        // Camera Drag (Right Screen Area)
        window.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (t.clientX > window.innerWidth / 2 && touchLookId === null) {
                    touchLookId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchLookId) {
                    const dx = t.clientX - lastTouchX;
                    const dy = t.clientY - lastTouchY;
                    player.rotation.y -= dx * 0.005;
                    player.rotation.x -= dy * 0.005;
                    player.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotation.x));
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        const resetLook = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchLookId) touchLookId = null;
            }
        };
        window.addEventListener('touchend', resetLook);
        window.addEventListener('touchcancel', resetLook);

        // --- ARRAYS FOR GAME OBJECTS ---
        const enemies = [];
        const projectiles = [];
        const particles = [];

        // --- HELPER FUNCTIONS ---
        function createParticle(pos, color, scale = 0.2) {
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(scale, 4, 4),
                new THREE.MeshBasicMaterial({ color: color })
            );
            p.position.copy(pos);
            p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10), life: 0.4 };
            scene.add(p);
            particles.push(p);
        }

        function createFlash(pos, color = 0xffff00) {
            for (let i = 0; i < 8; i++) createParticle(pos, color, 0.3);
        }

        // --- ENEMY CLASSES AND BESTIARY ---
        class Enemy {
            constructor(type, pos) {
                this.type = type;
                this.hp = 100;
                this.isParryable = false;
                this.mesh = new THREE.Group();
                this.mesh.position.copy(pos);
                this.speed = 4;
                this.attackTimer = 0;

                this.buildMesh();
                scene.add(this.mesh);
            }

            buildMesh() {
                const mat = new THREE.MeshStandardMaterial({ color: 0xaa2222 });
                if (this.type === 'shielded') {
                    this.hp = 150;
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2), mat);
                    const shieldMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
                    this.shield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 0.2), shieldMat);
                    this.shield.position.set(0, 0, 0.8);
                    this.mesh.add(body, this.shield);
                } else if (this.type === 'bloater') {
                    this.hp = 80;
                    this.speed = 2.5;
                    const body = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x22aa22 }));
                    this.mesh.add(body);
                } else if (this.type === 'rocketeer') {
                    this.hp = 120;
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), mat);
                    const launcher = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.2), new THREE.MeshStandardMaterial({ color: 0x444444 }));
                    launcher.position.set(0.6, 0.6, 0);
                    this.mesh.add(body, launcher);
                } else if (this.type === 'screamer') {
                    this.hp = 60;
                    this.mesh.position.y = 4.5;
                    const drone = new THREE.Mesh(new THREE.OctahedronGeometry(0.8), new THREE.MeshStandardMaterial({ color: 0xaa00aa }));
                    this.mesh.add(drone);
                } else if (this.type === 'turret') {
                    this.hp = 90;
                    // Robot with legs and sniper head
                    const head = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 1.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                    head.rotation.x = Math.PI / 2;
                    head.position.y = 1;
                    const base = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 4), new THREE.MeshStandardMaterial({ color: 0x555555 }));
                    this.mesh.add(head, base);
                } else if (this.type === 'swarmer') {
                    this.hp = 20;
                    this.speed = 7;
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), new THREE.MeshStandardMaterial({ color: 0xffaa00 }));
                    this.mesh.add(body);
                } else if (this.type === 'core_carrier') {
                    this.hp = 200;
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.8, 1.8), mat);
                    this.core = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                    this.core.position.set(0, 0.4, 0.9);
                    this.mesh.add(body, this.core);
                }
            }

            update(delta) {
                const dirToPlayer = new THREE.Vector3().subVectors(player.position, this.mesh.position);
                const dist = dirToPlayer.length();
                dirToPlayer.y = 0; dirToPlayer.normalize();

                this.attackTimer += delta;

                // Behavior per type
                if (this.type === 'shielded') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    this.mesh.lookAt(player.position.x, this.mesh.position.y, player.position.z);
                    if (dist < 2.5 && this.attackTimer > 2) {
                        this.isParryable = true;
                        createFlash(this.mesh.position, 0xffff00);
                        if (dist < 2.0) {
                            STATE.hp -= 20;
                            this.attackTimer = 0;
                            this.isParryable = false;
                        }
                    }
                } else if (this.type === 'bloater') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    if (dist < 2.5) {
                        this.explode();
                    }
                } else if (this.type === 'rocketeer') {
                    this.mesh.lookAt(player.position.x, this.mesh.position.y, player.position.z);
                    if (this.attackTimer > 3) {
                        this.isParryable = true;
                        createFlash(this.mesh.position, 0xffff00);
                        const rPos = this.mesh.position.clone().add(new THREE.Vector3(0, 0.6, 0));
                        const rDir = new THREE.Vector3().subVectors(player.position, rPos).normalize();
                        projectiles.push(new Rocket(rPos, rDir, false));
                        this.attackTimer = 0;
                        setTimeout(() => this.isParryable = false, 400);
                    }
                } else if (this.type === 'screamer') {
                    this.mesh.position.x += Math.sin(Date.now()*0.003) * 0.05;
                    this.mesh.lookAt(player.position);
                    if (this.attackTimer > 2.5) {
                        this.isParryable = true;
                        createFlash(this.mesh.position, 0xff0000);
                        if (this.attackTimer > 3.0) {
                            STATE.hp -= 10;
                            this.attackTimer = 0;
                            this.isParryable = false;
                        }
                    }
                } else if (this.type === 'turret') {
                    this.mesh.lookAt(player.position);
                    if (this.attackTimer > 4) {
                        this.isParryable = true;
                        createFlash(this.mesh.position, 0xff0000);
                        if (this.attackTimer > 4.5) {
                            STATE.hp -= 30;
                            this.attackTimer = 0;
                            this.isParryable = false;
                        }
                    }
                } else if (this.type === 'swarmer') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * delta);
                    if (dist < 1.2) {
                        STATE.hp -= 5;
                        this.takeDamage(100);
                    }
                } else if (this.type === 'core_carrier') {
                    this.mesh.position.addScaledVector(dirToPlayer, this.speed * 0.5 * delta);
                    if (this.attackTimer > 3) {
                        this.isParryable = true;
                        this.core.material.color.setHex(0xff0000);
                        if (this.attackTimer > 4) {
                            this.core.material.color.setHex(0x00ffff);
                            this.attackTimer = 0;
                            this.isParryable = false;
                        }
                    }
                }
            }

            takeDamage(amount, hitDir = null, isFront = false) {
                if (this.type === 'shielded' && isFront) {
                    createFlash(this.mesh.position, 0x00ffff);
                    return; // Blocked by shield
                }
                this.hp -= amount;
                createFlash(this.mesh.position, 0xff0000);
                if (this.hp <= 0) {
                    this.die();
                }
            }

            die() {
                if (this.type === 'bloater') this.explode();
                scene.remove(this.mesh);
                const idx = enemies.indexOf(this);
                if (idx > -1) enemies.splice(idx, 1);
                STATE.style += 100;
            }

            explode() {
                createFlash(this.mesh.position, 0xff5500);
                const dist = player.position.distanceTo(this.mesh.position);
                if (dist < 6) STATE.hp -= 35;
                // Chain reaction for other bloaters
                enemies.forEach(e => {
                    if (e !== this && e.type === 'bloater' && e.mesh.position.distanceTo(this.mesh.position) < 6) {
                        e.takeDamage(100);
                    }
                });
            }
        }

        // --- ROCKET PROJECTILE & MECHANICS ---
        class Rocket {
            constructor(pos, dir, isPlayer = true) {
                this.mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00ffff : 0xff5500 }));
                this.mesh.position.copy(pos);
                this.dir = dir.clone();
                this.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), this.dir);
                this.isPlayer = isPlayer;
                this.speed = 25;
                scene.add(this.mesh);
            }

            update(delta) {
                if (STATE.freezeRockets) return; // Freeze alt-fire mechanic
                this.mesh.position.addScaledVector(this.dir, this.speed * delta);

                // Rocket Ride mechanic
                if (player.ridingRocket === this) {
                    player.position.copy(this.mesh.position).add(new THREE.Vector3(0, 1.2, 0));
                }

                // Collisions
                if (this.mesh.position.distanceTo(player.position) < 1.5 && !this.isPlayer) {
                    STATE.hp -= 25;
                    this.destroy();
                }
                enemies.forEach(e => {
                    if (this.mesh.position.distanceTo(e.mesh.position) < 1.5) {
                        e.takeDamage(80);
                        this.destroy();
                    }
                });
            }

            destroy() {
                if (player.ridingRocket === this) player.ridingRocket = null;
                createFlash(this.mesh.position, 0xffaa00);
                scene.remove(this.mesh);
                const idx = projectiles.indexOf(this);
                if (idx > -1) projectiles.splice(idx, 1);
            }
        }

        // --- PARRY SYSTEM & ACTIONS ---
        function doParry() {
            let parried = false;

            // Parry Enemies
            enemies.forEach(e => {
                const dist = player.position.distanceTo(e.mesh.position);
                if (dist < 4.0 && e.isParryable) {
                    e.takeDamage(100);
                    parried = true;
                }
            });

            // Parry Enemy Projectiles
            projectiles.forEach(p => {
                if (!p.isPlayer && player.position.distanceTo(p.mesh.position) < 3.5) {
                    p.dir.negate();
                    p.isPlayer = true;
                    p.speed *= 1.5;
                    parried = true;
                }
            });

            if (parried) {
                STATE.hp = Math.min(100, STATE.hp + 30);
                triggerHitStop(0.3); // 0.3s Hit-stop on successful parry
            }
        }

        // --- WEAPON SYSTEM ---
        function shootWeapon() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const currentWpn = STATE.weapons[STATE.weaponIndex];

            if (currentWpn === 'Screwdriver') {
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !(obj.parent instanceof THREE.Scene) && !obj.userData.enemyRef) {
                        obj = obj.parent;
                    }
                    const enemy = enemies.find(e => e.mesh === obj || e.mesh.children.includes(obj));
                    if (enemy) {
                        const forward = new THREE.Vector3();
                        enemy.mesh.getWorldDirection(forward);
                        const isFront = raycaster.ray.direction.angleTo(forward) > Math.PI / 2;
                        enemy.takeDamage(50, raycaster.ray.direction, isFront);
                    }
                }
            } else if (currentWpn === 'Sharpshooter') {
                // Ricochet Raycast
                let ray = raycaster.ray.clone();
                for (let bounce = 0; bounce < 3; bounce++) {
                    const hits = raycaster.intersectObjects([...walls, ...enemies.map(e => e.mesh)], true);
                    if (hits.length > 0) {
                        const hit = hits[0];
                        createFlash(hit.point, 0x00ffff);
                        const enemy = enemies.find(e => e.mesh === hit.object || e.mesh.children.includes(hit.object));
                        if (enemy) {
                            enemy.takeDamage(45);
                            break;
                        } else {
                            // Bounce off wall
                            ray.origin.copy(hit.point);
                            ray.direction.reflect(hit.face.normal);
                            raycaster.ray.copy(ray);
                        }
                    } else break;
                }
            } else if (currentWpn === 'Jackhammer') {
                // Close range heavy push + front shield break
                let hitAny = false;
                enemies.forEach(e => {
                    if (player.position.distanceTo(e.mesh.position) < 3.5) {
                        e.takeDamage(90, null, false); // Bypasses shield
                        const pushDir = new THREE.Vector3().subVectors(e.mesh.position, player.position).normalize();
                        e.mesh.position.addScaledVector(pushDir, 4);
                        hitAny = true;
                    }
                });
                if (hitAny) triggerHitStop(0.3);
            } else if (currentWpn === 'RocketLauncher') {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                const r = new Rocket(player.position.clone().add(dir), dir, true);
                projectiles.push(r);
            } else if (currentWpn === 'Shotgun') {
                for (let i = 0; i < 6; i++) {
                    const spreadDir = raycaster.ray.direction.clone().add(new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2)).normalize();
                    const spreadRay = new THREE.Raycaster(player.position, spreadDir);
                    const hits = spreadRay.intersectObjects(enemies.map(e => e.mesh), true);
                    if (hits.length > 0) {
                        const enemy = enemies.find(e => e.mesh === hits[0].object || e.mesh.children.includes(hits[0].object));
                        if (enemy) enemy.takeDamage(15);
                    }
                }
            } else if (currentWpn === 'Nailgun') {
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    const enemy = enemies.find(e => e.mesh === hits[0].object || e.mesh.children.includes(hits[0].object));
                    if (enemy) enemy.takeDamage(12);
                }
            } else if (currentWpn === 'Railcannon') {
                // Core-Nuke check on Core Carrier
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0) {
                    const enemy = enemies.find(e => e.mesh === hits[0].object || e.mesh.children.includes(hits[0].object));
                    if (enemy) {
                        if (enemy.type === 'core_carrier' && enemy.isParryable) {
                            // Thermo-nuclear Core Nuke
                            createFlash(enemy.mesh.position, 0x00ffff);
                            enemies.forEach(e => {
                                if (e.mesh.position.distanceTo(enemy.mesh.position) < 12) e.takeDamage(250);
                            });
                        } else {
                            enemy.takeDamage(150);
                        }
                    }
                }
            }
        }

        // --- BUTTON EVENT BINDINGS ---
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });
        document.getElementById('btn-parry').addEventListener('touchstart', (e) => { e.preventDefault(); doParry(); });
        document.getElementById('btn-alt').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (STATE.weapons[STATE.weaponIndex] === 'RocketLauncher') {
                STATE.freezeRockets = !STATE.freezeRockets;
            }
        });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.onGround) player.velocity.y = 12;
            // Check rocket mount
            projectiles.forEach(p => {
                if (p.mesh.position.distanceTo(player.position) < 2.0) player.ridingRocket = p;
            });
        });
        document.getElementById('btn-dash').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            player.position.addScaledVector(dir, 5);
        });
        document.getElementById('btn-swap').addEventListener('touchstart', (e) => {
            e.preventDefault();
            STATE.weaponIndex = (STATE.weaponIndex + 1) % STATE.weapons.length;
            document.getElementById('weapon-val').innerText = STATE.weapons[STATE.weaponIndex];
        });

        // --- WAVE SPAWNER ---
        function spawnWave() {
            const types = ['shielded', 'bloater', 'rocketeer', 'screamer', 'turret', 'swarmer', 'core_carrier'];
            types.forEach(t => {
                const pos = new THREE.Vector3((Math.random()-0.5)*50, 1, (Math.random()-0.5)*50);
                enemies.push(new Enemy(t, pos));
            });
            // Additional Swarmers
            for(let i=0; i<4; i++) {
                enemies.push(new Enemy('swarmer', new THREE.Vector3((Math.random()-0.5)*40, 1, (Math.random()-0.5)*40)));
            }
        }
        spawnWave();

        // --- MAIN GAME LOOP ---
        let lastTime = performance.now();

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // --- HIT-STOP LOGIC ---
            if (hitStopTimer > 0) {
                hitStopTimer -= delta;
                if (hitStopTimer <= 0) {
                    document.getElementById('hitstop-overlay').style.display = 'none';
                }
                renderer.render(scene, camera);
                return; // Freeze game physics during hit-stop
            }

            // Player Movement
            const moveDir = new THREE.Vector3(moveInput.x, 0, moveInput.y);
            moveDir.applyEuler(new THREE.Euler(0, player.rotation.y, 0));
            
            if (!player.ridingRocket) {
                player.position.addScaledVector(moveDir, 10 * delta);
                player.velocity.y -= 25 * delta; // Gravity
                player.position.y += player.velocity.y * delta;

                if (player.position.y <= 1.6) {
                    player.position.y = 1.6;
                    player.velocity.y = 0;
                    player.onGround = true;
                } else {
                    player.onGround = false;
                }
            }

            camera.position.copy(player.position);
            camera.rotation.copy(player.rotation);

            // Update Enemies
            enemies.forEach(e => e.update(delta));

            // Update Projectiles
            projectiles.forEach(p => p.update(delta));

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.userData.vel, delta);
                p.userData.life -= delta;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // Wave progress check
            if (enemies.length === 0) {
                STATE.wave++;
                spawnWave();
            }

            // HUD Update
            document.getElementById('hp-val').innerText = Math.max(0, Math.floor(STATE.hp));
            document.getElementById('style-val').innerText = STATE.style;
            document.getElementById('wave-val').innerText = STATE.wave;
            document.getElementById('enemy-val').innerText = enemies.length;

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
